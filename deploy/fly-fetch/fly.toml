# Rename the app before provisioning. Never attach DTSC databases or 6PN peers.
app = "dtsc-mcp-fetch"
primary_region = "cdg"

[build]
  dockerfile = "deploy/fly-fetch/Dockerfile"

[env]
  MCP_BRIDGE_BIND = "0.0.0.0"
  MCP_BRIDGE_PORT = "8686"

[http_service]
  internal_port = 8686
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
