name: Apply standard iteration 06

on:
  push:
    branches:
      - chore/apply-standard-iteration-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: chore/apply-standard-iteration-06
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and decode iteration 06 commit series
        run: |
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1aJPq6KU0JdILoPaTmsfgMyk1t_ses0Ce&export=download&confirm=t" --output /tmp/iteration06-series
          file /tmp/iteration06-series
          if gzip --test /tmp/iteration06-series 2>/dev/null; then
            gzip --decompress --stdout /tmp/iteration06-series > /tmp/iteration06-series.mbox
          elif xz --test /tmp/iteration06-series 2>/dev/null; then
            xz --decompress --stdout /tmp/iteration06-series > /tmp/iteration06-series.mbox
          else
            echo "Unsupported transfer format" >&2
            head -c 128 /tmp/iteration06-series | xxd >&2
            exit 1
          fi
          grep -q '^From ' /tmp/iteration06-series.mbox

      - name: Apply commit series to feature branch
        run: |
          git checkout feat/standard-modules-professionalization-iteration-06-enterprise-governance
          git reset --hard origin/feat/standard-modules-professionalization-iteration-06-enterprise-governance
          git am /tmp/iteration06-series.mbox
          git push origin HEAD:feat/standard-modules-professionalization-iteration-06-enterprise-governance
