name: Apply standard iteration 06

on:
  push:
    branches:
      - chore/apply-standard-iteration-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: chore/apply-standard-iteration-06
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild iteration 06 commit series
        run: |
          cat .transfer/iteration06.xz.b64.* > /tmp/iteration06.xz.b64
          base64 --decode /tmp/iteration06.xz.b64 > /tmp/iteration06-series.mbox.xz
          xz --test /tmp/iteration06-series.mbox.xz
          xz --decompress --stdout /tmp/iteration06-series.mbox.xz > /tmp/iteration06-series.mbox
          test -s /tmp/iteration06-series.mbox

      - name: Apply product commits to feature branch
        run: |
          git checkout feat/standard-modules-professionalization-iteration-06-enterprise-governance
          git reset --hard origin/feat/standard-modules-professionalization-iteration-06-enterprise-governance
          git am /tmp/iteration06-series.mbox
          git checkout origin/feat/standard-modules-professionalization-iteration-06-enterprise-governance -- .github/workflows/quality-gates.yml
          if ! git diff --quiet; then
            git add .github/workflows/quality-gates.yml
            git commit -m "chore(ci): defer quality gate workflow update"
          fi
          git push origin HEAD:feat/standard-modules-professionalization-iteration-06-enterprise-governance
