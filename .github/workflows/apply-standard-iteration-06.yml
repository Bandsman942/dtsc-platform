name: Apply standard iteration 06

on:
  push:
    branches:
      - chore/apply-standard-iteration-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/standard-modules-professionalization-iteration-06-enterprise-governance
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download and apply commit series
        run: |
          curl --fail --location --retry 3 "https://drive.usercontent.google.com/download?id=1aJPq6KU0JdILoPaTmsfgMyk1t_ses0Ce&export=download&confirm=t" --output /tmp/iteration06-series.mbox.gz
          gzip -t /tmp/iteration06-series.mbox.gz
          gunzip -c /tmp/iteration06-series.mbox.gz > /tmp/iteration06-series.mbox
          git am /tmp/iteration06-series.mbox
          git push origin HEAD:feat/standard-modules-professionalization-iteration-06-enterprise-governance
