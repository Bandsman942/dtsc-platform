name: Sprint 4 type boundary fix

on:
  push:
    branches:
      - feat/sprint-04-work-prestations
    paths:
      - .github/workflows/sprint4-fix-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-04-work-prestations
          fetch-depth: 0

      - name: Fix serialization and keep GET side-effect free
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/work-prestations.ts")
          text = path.read_text()
          old = '''  const currentSubmission = submissions.find((item) => dateKeyFromUtcDate(item.periodStart) === currentPeriod.periodStart)
    || await ensureDraftSubmissionForDate(actor, today);
  const all = submissions.some((item) => item.id === currentSubmission.id) ? submissions : [currentSubmission, ...submissions];
  return {
    timezone,
    today,
    currentPeriod,
    currentSubmission: serializeSubmission(currentSubmission),
    submissions: all.map(serializeSubmission),
  };
'''
          new = '''  const currentSubmission = submissions.find((item) => dateKeyFromUtcDate(item.periodStart) === currentPeriod.periodStart) || {
    id: `unsaved-${actor.id}-${currentPeriod.periodStart}`,
    employeeId: actor.id,
    periodStart: dateOnlyToUtc(currentPeriod.periodStart),
    periodEnd: dateOnlyToUtc(currentPeriod.periodEnd),
    status: "DRAFT",
    declaredMinutes: 0,
    validatedMinutes: null,
    submittedAt: null,
    reviewerEmployeeId: null,
    reviewedAt: null,
    reviewComment: null,
    revision: 0,
    createdAt: new Date(),
    updatedAt: new Date(),
    entries: [],
    reviews: [],
  };
  const all = submissions.some((item) => item.id === currentSubmission.id) ? submissions : [currentSubmission, ...submissions];
  return {
    timezone,
    today,
    currentPeriod,
    currentSubmission: serializeSubmission(currentSubmission),
    submissions: all.map((submission) => serializeSubmission(submission)),
  };
'''
          if old not in text:
              raise SystemExit("Expected getOwnWorkState block not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Restore permanent quality workflow and remove temporary workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gates.yml
          git rm -f .github/workflows/sprint4-fix-types.yml

      - name: Validate and push fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(work): keep work-state reads side-effect free"
          git push origin HEAD:feat/sprint-04-work-prestations
