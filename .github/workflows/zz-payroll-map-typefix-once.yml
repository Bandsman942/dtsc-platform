name: Payroll map typefix integrator

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'fix/sprint-05-payroll-submission-retry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply typefix
        run: node scripts/apply-payroll-map-typefix-once.mjs
      - name: Remove one-shot files
        run: rm -f scripts/apply-payroll-map-typefix-once.mjs .github/workflows/zz-payroll-map-typefix-once.yml
      - name: Diff checks
        run: git diff --check
      - name: Commit typefix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve payroll serializer callback typing"
          git push origin HEAD:${{ github.head_ref }}
