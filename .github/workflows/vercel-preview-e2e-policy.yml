name: Vercel Preview and pre-merge E2E policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vercel-production-only-status.yml'
      - '.github/workflows/quality-gates.yml'
      - '.github/workflows/vercel-preview-e2e-policy.yml'
      - 'docs/VERCEL_PREVIEW_E2E_POLICY.md'
      - 'scripts/qa-vercel-preview-e2e-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contract:
    name: Preview / pre-merge E2E policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Preview and pre-merge E2E policy
        run: node scripts/qa-vercel-preview-e2e-policy.mjs
