name: Codex Retail hook dependency repair 369

on:
  push:
    branches:
      - refactor/367-retail-operator-i18n

permissions:
  contents: write

concurrency:
  group: codex-369-retail-hook-deps
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: refactor/367-retail-operator-i18n
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repair locale hook dependencies and lint debt
        run: node scripts/codex-369-fix-retail-hook-deps.mjs
      - name: Lint
        run: pnpm lint
      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm type-check
      - name: Commit repair and remove scaffolding
        run: |
          git rm -f .github/workflows/codex-369-fix-retail-hook-deps.yml scripts/codex-369-fix-retail-hook-deps.mjs
          git add components/enterprise/professional/retail-workspace-shared.tsx components/enterprise/professional/mobile-money-agency-workspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(retail): clear operator i18n lint debt"
          git push origin HEAD:refactor/367-retail-operator-i18n
