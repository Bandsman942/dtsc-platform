name: Codex Retail QA contract fix 369

on:
  push:
    branches:
      - refactor/367-retail-operator-i18n

permissions:
  contents: write

concurrency:
  group: codex-369-retail-qa-contract-fix
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: refactor/367-retail-operator-i18n
          fetch-depth: 0
      - name: Patch historical Retail contract
        run: node scripts/codex-369-retail-qa-contract-fix.mjs
      - name: Validate Retail product coherence
        run: node scripts/qa-retail-product-coherence.mjs
      - name: Commit QA reconciliation and remove scaffolding
        run: |
          git rm -f .github/workflows/codex-369-retail-qa-contract-fix.yml scripts/codex-369-retail-qa-contract-fix.mjs
          git add scripts/qa-retail-product-coherence.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(retail): validate daily-close labels via canonical i18n"
          git push origin HEAD:refactor/367-retail-operator-i18n
