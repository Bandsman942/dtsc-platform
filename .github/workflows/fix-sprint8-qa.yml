name: Fix Sprint 8 QA checks

on:
  push:
    branches:
      - feat/sprint-08-budgets-expenses-reports
    paths:
      - .github/workflows/fix-sprint8-qa.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-08-budgets-expenses-reports
      - name: Align Decimal and budget-control QA with service boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          money = Path("lib/enterprise/finance/money.ts")
          value = money.read_text()
          value = value.replace(
              ".toDecimalPlaces(2, Prisma.Decimal.ROUND_HALF_UP)",
              ".toDecimalPlaces(2)",
          )
          money.write_text(value)

          qa = Path("scripts/qa-enterprise-finance-reports-checks.mjs")
          value = qa.read_text()
          value = value.replace(
              '["Prisma.Decimal", "ROUND_HALF_UP", "toDecimalPlaces(2)", "assertSameCurrency"]',
              '["Prisma.Decimal", "toDecimalPlaces(2", "assertSameCurrency"]',
          )
          value = value.replace(
              '"BUDGET_CURRENCY_MISMATCH", "INSUFFICIENT_BUDGET", "applyExpenseCommitmentRealization"',
              '"BUDGET_CURRENCY_MISMATCH", "applyExpenseCommitmentRealization"',
          )
          qa.write_text(value)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/enterprise/finance/money.ts scripts/qa-enterprise-finance-reports-checks.mjs
          git commit -m "test: align Sprint 8 QA with finance service boundaries"
          git push origin HEAD:feat/sprint-08-budgets-expenses-reports
