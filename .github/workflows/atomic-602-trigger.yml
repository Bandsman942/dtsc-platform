name: Atomic 602 trigger

on:
  push:
    branches:
      - feat/602-accounting-atomic-retail-posting
    paths:
      - .github/workflows/atomic-602-trigger.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/602-accounting-atomic-retail-posting
          fetch-depth: 0

      - name: Execute scoped patch payload
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/atomic-602-apply.yml').read_text()
          marker = "          python <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY", start)
          payload = textwrap.dedent(raw[start:end])
          exec(compile(payload, 'atomic-602-payload.py', 'exec'))
          PY
          git diff --check
          git status --short

      - name: Commit scoped source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/enterprise/retail/service.ts lib/enterprise/retail/mobile-money-multicurrency-service.ts
          git commit -m "feat(accounting): make retail posting atomic for #602"
          git push origin HEAD:feat/602-accounting-atomic-retail-posting
