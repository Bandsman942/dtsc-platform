name: Fix iteration 05 typecheck

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-iteration05-typecheck.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply verified type fixes
        shell: bash
        run: |
          cat > /tmp/typefix.patch.b64 <<'PATCH'

PATCH
          echo "b63a08af5af070816b765076b95dadff0a43900bcfc1639bef46b76abfdcc981  /tmp/typefix.patch.b64" | sha256sum --check -
          base64 --decode /tmp/typefix.patch.b64 > /tmp/typefix.patch
          echo "c7d96a5acc71c7728df2429d156926d525c81d9a1de5921dac4e2070e7765086  /tmp/typefix.patch" | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/typefix.patch
          git diff --cached --check

      - name: Publish type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): preserve narrowed chat context during streaming"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
