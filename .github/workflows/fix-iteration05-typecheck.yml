name: Fix iteration 05 typecheck

on:
  push:
    branches:
      - feat/standard-modules-professionalization-iteration-05-ai-knowledge
    paths:
      - ".github/workflows/fix-iteration05-typecheck.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Apply guarded type fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(content.replace(old, new))

          replace_once(
              "app/api/chat/route.ts",
              "estimatedCost: estimateCost({ model, inputTokens: usage.inputTokens, outputTokens: usage.outputTokens }),",
              "estimatedCost: estimateCost({ model, inputTokens: usage.inputTokens, outputTokens: usage.outputTokens }) ?? undefined,",
          )

          replace_once(
              "app/api/chat/v2/route.ts",
              "  const modelCall = await startAiModelCall({\n    userId: session.userId,\n    organizationId,\n    contextCode,\n    locale,\n    conversationId: conversation.id,",
              "  const sessionUserId = session.userId;\n  const conversationId = conversation.id;\n\n  const modelCall = await startAiModelCall({\n    userId: sessionUserId,\n    organizationId,\n    contextCode,\n    locale,\n    conversationId,",
          )
          replacements = {
              "userId: session.userId, organizationId, conversationId: conversation.id, model: routed.modelCode": "userId: sessionUserId, organizationId, conversationId, model: routed.modelCode",
              "conversationId: conversation.id, organizationId, role: \"assistant\"": "conversationId, organizationId, role: \"assistant\"",
              "where: { id: conversation.id }, data: { updatedAt: new Date() }": "where: { id: conversationId }, data: { updatedAt: new Date() }",
              "userId: session.userId,\n      startedAt,\n      metadata: { providerCode: routed.providerCode, model: routed.modelCode, conversationId: conversation.id,": "userId: sessionUserId,\n      startedAt,\n      metadata: { providerCode: routed.providerCode, model: routed.modelCode, conversationId,",
              "userId: session.userId, startedAt, metadata: { conversationId: conversation.id, reasonCode:": "userId: sessionUserId, startedAt, metadata: { conversationId, reasonCode:",
          }
          file = Path("app/api/chat/v2/route.ts")
          content = file.read_text()
          for old, new in replacements.items():
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"chat v2: expected one match, found {count}: {old[:60]}")
              content = content.replace(old, new)
          file.write_text(content)

          replace_once(
              "app/api/enterprise/ai/chat/route.ts",
              "    const modelCall = await startAiModelCall({\n      userId: session.userId,\n      organizationId: data.organizationId,\n      contextCode: \"ORGANIZATION\",\n      locale,\n      enterpriseConversationId: conversation.id,",
              "    const sessionUserId = session.userId;\n    const authorizedAccess = access;\n    const conversationId = conversation.id;\n    const conversationTitle = conversation.title;\n\n    const modelCall = await startAiModelCall({\n      userId: sessionUserId,\n      organizationId: data.organizationId,\n      contextCode: \"ORGANIZATION\",\n      locale,\n      enterpriseConversationId: conversationId,",
          )
          replacements = {
              "conversationId: conversation.id,\n              role: \"assistant\"": "conversationId,\n              role: \"assistant\"",
              "where: { id: conversation.id }, data: { lastMessageAt: new Date(), title: conversation.title === \"Nouvelle conversation\"": "where: { id: conversationId }, data: { lastMessageAt: new Date(), title: conversationTitle === \"Nouvelle conversation\"",
              "assistantId: access.assistantId, conversationId: conversation.id, userId: session.userId": "assistantId: authorizedAccess.assistantId, conversationId, userId: sessionUserId",
              "writeAuditLog({ userId: session.userId, action:": "writeAuditLog({ userId: sessionUserId, action:",
              "entityId: conversation.id, request:": "entityId: conversationId, request:",
              "getEnterpriseAiUsageSnapshot(data.organizationId, session.userId, access)": "getEnterpriseAiUsageSnapshot(data.organizationId, sessionUserId, authorizedAccess)",
              "userId: session.userId, startedAt, metadata: { organizationId: data.organizationId, conversationId: conversation.id, providerCode:": "userId: sessionUserId, startedAt, metadata: { organizationId: data.organizationId, conversationId, providerCode:",
              "userId: session.userId, startedAt, metadata: { organizationId: data.organizationId, conversationId: conversation.id, reasonCode:": "userId: sessionUserId, startedAt, metadata: { organizationId: data.organizationId, conversationId, reasonCode:",
              "\"X-Conversation-Id\": conversation.id,": "\"X-Conversation-Id\": conversationId,",
          }
          file = Path("app/api/enterprise/ai/chat/route.ts")
          content = file.read_text()
          for old, new in replacements.items():
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"enterprise chat: expected one match, found {count}: {old[:60]}")
              content = content.replace(old, new)
          file.write_text(content)
          PY
          git diff --check

      - name: Publish type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/chat/route.ts app/api/chat/v2/route.ts app/api/enterprise/ai/chat/route.ts
          git commit -m "fix(ai): preserve narrowed chat context during streaming"
          git push origin HEAD:${{ github.ref_name }}
