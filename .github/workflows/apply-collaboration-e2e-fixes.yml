name: Apply collaboration E2E fixes

on:
  push:
    branches:
      - chore/apply-collaboration-e2e-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cat .patches/e2e-fixes.* > /tmp/e2e-fixes.patch.gz.b64
          echo "de234995db1a3c404cb1b435f1afe7d6e86400dc98ff93b950adc5dc940edc91  /tmp/e2e-fixes.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/e2e-fixes.patch.gz.b64 | gzip -d > /tmp/e2e-fixes.patch
          echo "e3da0ca52dc98f4bbcb55b1d2fc1018d975089225e0ebd5aa3c88abef1e2bdb6  /tmp/e2e-fixes.patch" | sha256sum -c -

      - name: Apply to exact main and push feature branch
        env:
          FEATURE_BRANCH: fix/collaboration-e2e-rich-announcements
        run: |
          git fetch origin main
          git switch --detach origin/main
          git apply --check /tmp/e2e-fixes.patch
          git apply /tmp/e2e-fixes.patch
          git switch -c "$FEATURE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize collaboration and enrich announcements"
          git push --force-with-lease origin "HEAD:$FEATURE_BRANCH"
