name: Apply collaboration E2E fixes

on:
  push:
    branches:
      - chore/apply-collaboration-e2e-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align-regression-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update explicit receipt regression contract
        env:
          FEATURE_BRANCH: fix/collaboration-e2e-rich-announcements
        run: |
          git fetch origin "$FEATURE_BRANCH"
          git switch -C "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/qa-erp-professional-iteration-03-checks.mjs")
          content = path.read_text()
          previous = '    for (const marker of ["CheckCheck", "MessageReceiptIndicator", "summary?.allRead", "summary?.allDelivered", "text-emerald-300"]) need(content.conversation, marker, "Accusés dans les bulles");'
          replacement = '''    for (const marker of ["CheckCheck", "MessageReceiptIndicator", "summary?.allDelivered"]) need(content.conversation, marker, "Accusés dans les bulles");
              needAny(content.conversation, ["summary?.allRead", "summary?.readCount"], "Lecture explicite dans les bulles");
              needAny(content.conversation, ["text-emerald-300", "text-cyan-200"], "Couleur des accusés lus");'''
          if previous not in content:
              raise SystemExit("Receipt regression marker not found")
          path.write_text(content.replace(previous, replacement))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa-erp-professional-iteration-03-checks.mjs
          git commit -m "test: align explicit read receipt contract"
          git push origin "HEAD:$FEATURE_BRANCH"
