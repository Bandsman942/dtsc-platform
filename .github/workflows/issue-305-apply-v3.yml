name: Issue 305 apply v3

on:
  push:
    branches:
      - refactor/305-async-confirmation-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/305-async-confirmation-convergence
          fetch-depth: 0
      - name: Apply implementation
        run: python scripts/issue-305-apply.py
      - name: Verify targeted contracts
        run: |
          node scripts/qa-305-async-confirmation-convergence.mjs
          node scripts/qa-cross-app-ux-integrity-hotfix.mjs
          git diff --check
      - name: Remove temporary patch machinery
        run: rm -f .github/workflows/issue-305-patch.yml .github/workflows/issue-305-patch-v2.yml .github/workflows/issue-305-apply-v3.yml scripts/issue-305-apply.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ux): converge confirmations on async DTSC contract"
          git push origin HEAD:refactor/305-async-confirmation-convergence
