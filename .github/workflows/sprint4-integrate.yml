name: Sprint 4 structural integration

on:
  push:
    branches:
      - feat/sprint-04-work-prestations
    paths:
      - .github/workflows/sprint4-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-04-work-prestations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration
        run: node scripts/sprint4-integrate.mjs

      - name: Validate changed text
        run: git diff --check

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md app/activities/page.tsx app/admin/page.tsx components/activities/activities-dashboard.tsx docs/CHANGELOG.md docs/QA_REGRESSION_CHECKLIST.md docs/TECHNICAL_DOCUMENTATION.md lib/openai.ts lib/public-content.ts locales/en.json locales/fr.json package.json prisma/schema.prisma
          git diff --cached --check
          git commit -m "feat(work): integrate Sprint 4 workflow surfaces"
          git push origin HEAD:feat/sprint-04-work-prestations
