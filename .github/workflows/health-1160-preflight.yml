# Temporary isolated QA; never deploys and must be removed before merging.
name: HEALTH integration isolated preflight 1160

on:
  push:
    branches: [fix/1146-health-all-tranches-ci]

permissions:
  contents: read

concurrency:
  group: health-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Health six-lot quality on isolated database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_health_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_health_e2e_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_health_e2e_test?schema=public
      AUTH_SECRET: health-preflight-synthetic-session-secret-longer-than-32
      APP_URL: http://127.0.0.1:3000
      CRON_SECRET: health-preflight-synthetic-cron-secret-longer-than-24
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma
        run: pnpm prisma:generate
      - name: Migrate isolated PostgreSQL
        run: pnpm prisma:deploy
      - name: HEALTH 01-06 contract and behavioral tests
        run: pnpm qa:health-preflight
      - name: HEALTH-03 real PostgreSQL appointment concurrency
        run: pnpm qa:health-03-postgres
      - name: TypeScript
        run: pnpm type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
