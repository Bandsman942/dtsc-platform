name: Export current iteration 07 branch

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-v2
    paths:
      - '.github/workflows/export-current-iteration-07-branch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iteration-07-e2e-remediation-v2
          fetch-depth: 0
      - run: git archive --format=zip --output=current-iteration-07-branch.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-iteration-07-branch
          path: current-iteration-07-branch.zip
          retention-days: 1
