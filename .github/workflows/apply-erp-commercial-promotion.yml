name: Apply ERP commercial promotion

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/erp-iteration-02-commercial-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: agent/erp-iteration-02-commercial-ready
          fetch-depth: 0

      - name: Apply reviewed promotion payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/erp-promotion.b64
          for blob in \
            b5651fc6d5d7ca2812f89223fc7987fa7000a6e2 \
            03d5b167b5a69251971acaba6d899f2306ad40cb \
            133d043cebbee3a76d60d02b816fd16f38c5124c \
            e22a8316fa380f253b22d14a9e8b8db49564e098 \
            f12f4582059f5d6d2624745f186fcee95c41b9a5
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | jq -r '.content' \
              | base64 --decode >> /tmp/erp-promotion.b64
          done
          base64 --decode /tmp/erp-promotion.b64 > /tmp/erp-promotion.tar.gz
          echo "894e154e5c95a3eabf70e530befc38b30b695d60f2cffce5bc1b64a131977786  /tmp/erp-promotion.tar.gz" | sha256sum --check -
          tar -xzf /tmp/erp-promotion.tar.gz
          rm .github/workflows/apply-erp-commercial-promotion.yml

      - name: Verify prepared changes
        run: |
          set -euo pipefail
          node --check scripts/qa-erp-professional-contracts-checks.mjs
          node --check scripts/qa-enterprise-identity-form-integration-checks.mjs
          node -e 'JSON.parse(require("fs").readFileSync("lib/enterprise/module-registry-common-domains.json", "utf8")); JSON.parse(require("fs").readFileSync("lib/enterprise/module-commercial-readiness.json", "utf8"));'
          node - <<'NODE'
          const fs = require('fs');
          const readiness = JSON.parse(fs.readFileSync('lib/enterprise/module-commercial-readiness.json', 'utf8'));
          for (const code of ['CRM_CUSTOMERS', 'CATALOG', 'SITES_WAREHOUSES', 'CRM_PIPELINE', 'CONTRACTS']) {
            const module = readiness.moduleOverrides[code];
            if (!module || module.maturity !== 'COMMERCIAL_READY' || !module.commercializable || module.criteriaMissing.length) {
              throw new Error(`${code} is not commercially ready`);
            }
          }
          NODE
          git diff --check

      - name: Commit promotion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: promote ERP iteration 2 modules to commercial ready"
          git push origin HEAD:agent/erp-iteration-02-commercial-ready
