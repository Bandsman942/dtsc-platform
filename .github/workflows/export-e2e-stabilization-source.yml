name: Export E2E stabilization source

on:
  push:
    branches:
      - chore/export-e2e-stabilization-source
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'chore/export-e2e-stabilization-source' || github.ref == 'refs/heads/chore/export-e2e-stabilization-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        run: git archive --format=zip --output=dtsc-e2e-stabilization-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dtsc-e2e-stabilization-source
          path: dtsc-e2e-stabilization-source.zip
          if-no-files-found: error
          retention-days: 1
