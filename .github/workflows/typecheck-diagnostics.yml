name: Typecheck Diagnostics

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-v3-final
    paths:
      - ".github/workflows/typecheck-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_typecheck?schema=public
      AUTH_SECRET: typecheck-auth-secret-with-more-than-thirty-two-characters
      APP_URL: http://127.0.0.1:3000
      CRON_SECRET: typecheck-cron-secret-with-more-than-twenty-four-characters
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prisma:generate
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm type-check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "$status" > typecheck.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: iteration07-v3-typecheck-diagnostics
          path: |
            typecheck.log
            typecheck.status
          if-no-files-found: error
