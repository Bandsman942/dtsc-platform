name: Fix finance statement options

on:
  push:
    branches:
      - feat/erp-consolidation-iteration-03-finance-accounting
    paths:
      - .github/workflows/fix-finance-statement-options.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/erp-consolidation-iteration-03-finance-accounting
          fetch-depth: 0
      - name: Align UI values with Zod enum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('components/enterprise/enterprise-finance-workspace.tsx')
          text = path.read_text()
          text = text.replace('value="AGED_RECEIVABLES"', 'value="AR_AGING"')
          text = text.replace('value="AGED_PAYABLES"', 'value="AP_AGING"')
          text = text.replace('value="TAX_SUMMARY"', 'value="TAX"')
          text = text.replace('<option value="GENERAL_LEDGER">General ledger</option>', '<option value="GENERAL_LEDGER">General ledger</option><option value="JOURNALS">Journals</option>')
          text = text.replace('<option value="CASH_FLOW">Cash flow</option>', '<option value="CASH_FLOW">Cash flow</option><option value="TREASURY">Treasury statement</option>')
          path.write_text(text)
          PY
          git rm .github/workflows/fix-finance-statement-options.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/enterprise/enterprise-finance-workspace.tsx
          git commit -m 'fix: align financial statement workspace options'
          git push origin HEAD:feat/erp-consolidation-iteration-03-finance-accounting
