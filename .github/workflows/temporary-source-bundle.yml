name: Temporary source bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build source archive
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' -czf /tmp/dtsc-platform-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dtsc-platform-source
          path: /tmp/dtsc-platform-source.tgz
          retention-days: 1
          if-no-files-found: error
