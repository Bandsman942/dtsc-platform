name: Apply iteration 2 source patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/iteration2-patch/**"
      - ".github/workflows/apply-iteration2-patch.yml"
      - ".github/workflows/temporary-source-bundle.yml"

permissions:
  contents: write

concurrency:
  group: apply-iteration2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/erp-professionalization-iteration-02-crm-master-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/erp-professionalization-iteration-02-crm-master-data
          fetch-depth: 0

      - name: Rehydrate and verify patch
        run: |
          cat .github/iteration2-patch/part* | base64 --decode | xz --decompress > /tmp/iteration2.patch
          echo "1a59bcfb78c90bf6601c212d04bdfbe9746b503abce6d99c7f10639aae6182e3  /tmp/iteration2.patch" | sha256sum -c -
          git apply --check --exclude=.github/workflows/temporary-source-bundle.yml /tmp/iteration2.patch

      - name: Apply and publish implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --exclude=.github/workflows/temporary-source-bundle.yml /tmp/iteration2.patch
          git rm -r .github/iteration2-patch .github/workflows/apply-iteration2-patch.yml .github/workflows/temporary-source-bundle.yml
          git commit -m "feat: professionalize ERP master data CRM contracts and identity links"
          git push origin HEAD:feat/erp-professionalization-iteration-02-crm-master-data
