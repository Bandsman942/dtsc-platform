name: Apply Typecheck Fixes

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-v3-final
    paths:
      - ".github/workflows/apply-typecheck-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remaining targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('components/productivity/professional-toolbox.tsx')
          source = path.read_text()
          if 'ClipboardCut' not in source:
              raise SystemExit('ClipboardCut identifier not found')
          source = source.replace('ClipboardCopy, ClipboardCut, ClipboardPaste', 'ClipboardCopy, ClipboardPaste, Scissors')
          source = source.replace('<ClipboardCut ', '<Scissors ')
          path.write_text(source)

          path = Path('lib/standard-collaboration.ts')
          source = path.read_text()
          if 'acceptedAt: true' not in source or 'request.acceptedAt' not in source:
              raise SystemExit('acceptedAt contact fields not found')
          source = source.replace('acceptedAt: true', 'respondedAt: true')
          source = source.replace('request.acceptedAt || request.updatedAt', 'request.respondedAt || request.updatedAt')
          path.write_text(source)

          route = Path('app/api/toolbox/notes/[id]/route.ts').read_text()
          if 'const { contentHtml, contentText, labels, dueAt, ...scalarUpdates } = parsed.data;' not in route:
              raise SystemExit('toolbox route normalization missing')
          PY
          git diff --check
      - name: Commit and push code fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/productivity/professional-toolbox.tsx lib/standard-collaboration.ts
          git commit -m "fix: resolve iteration 07 v3 type errors"
          git push origin HEAD:fix/iteration-07-e2e-remediation-v3-final
