name: SCALE-7 staged load certification

on:
  workflow_dispatch:
    inputs:
      target_vus:
        description: Certification stage
        required: true
        type: choice
        options: ["500", "1000", "2500", "5000"]
      load_profile:
        description: Load profile
        required: true
        default: ramp
        type: choice
        options: [ramp, soak, spike]
      confirmation:
        description: Type RUN_SCALE7_CERTIFICATION to authorize the bounded load run
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: scale7-certification
  cancel-in-progress: false

jobs:
  staged-certification:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 360 &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, 'RUN_SCALE7_'))
    name: SCALE-7 staged certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ vars.SCALE7_LOAD_BASE_URL || vars.SCALE1_LOAD_BASE_URL || 'https://app.dtsc-platform.com' }}
      SCALE7_AUTH_CONTEXTS_JSON: ${{ secrets.SCALE7_AUTH_CONTEXTS_JSON }}
      OBSERVABILITY_COOKIE: ${{ secrets.SCALE7_CTO_SESSION_COOKIE || secrets.SCALE1_CTO_SESSION_COOKIE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '' }}
      LOAD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.load_profile || '' }}
      MANUAL_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}
      OWNER_COMMAND: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Validate certification trigger contract
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_VUS:-}"
          profile="${LOAD_PROFILE:-}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${MANUAL_CONFIRMATION}" != "RUN_SCALE7_CERTIFICATION" ]; then
              echo "::error::Confirmation must be RUN_SCALE7_CERTIFICATION."
              exit 1
            fi
          else
            if [ "${{ github.event.issue.number }}" != "360" ] || [ "${{ github.event.comment.author_association }}" != "OWNER" ]; then
              echo "::error::Only the repository OWNER may trigger SCALE-7 from Issue #360."
              exit 1
            fi
            case "${OWNER_COMMAND}" in
              RUN_SCALE7_500_RAMP) target=500; profile=ramp ;;
              RUN_SCALE7_500_SOAK) target=500; profile=soak ;;
              RUN_SCALE7_500_SPIKE) target=500; profile=spike ;;
              RUN_SCALE7_1000_RAMP) target=1000; profile=ramp ;;
              RUN_SCALE7_1000_SOAK) target=1000; profile=soak ;;
              RUN_SCALE7_1000_SPIKE) target=1000; profile=spike ;;
              RUN_SCALE7_2500_RAMP) target=2500; profile=ramp ;;
              RUN_SCALE7_2500_SOAK) target=2500; profile=soak ;;
              RUN_SCALE7_2500_SPIKE) target=2500; profile=spike ;;
              RUN_SCALE7_5000_RAMP) target=5000; profile=ramp ;;
              RUN_SCALE7_5000_SOAK) target=5000; profile=soak ;;
              RUN_SCALE7_5000_SPIKE) target=5000; profile=spike ;;
              *) echo "::error::Unsupported SCALE-7 owner command."; exit 1 ;;
            esac
          fi

          echo "TARGET_VUS=${target}" >> "$GITHUB_ENV"
          echo "LOAD_PROFILE=${profile}" >> "$GITHUB_ENV"

          for name in BASE_URL OBSERVABILITY_COOKIE VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required SCALE-7 configuration is missing: ${name}."
              exit 1
            fi
          done
          echo "::add-mask::${VERCEL_AUTOMATION_BYPASS_SECRET}"
          case "$BASE_URL" in https://*) ;; *) echo "::error::SCALE7_LOAD_BASE_URL must use HTTPS."; exit 1 ;; esac
          case "$target" in 500|1000|2500|5000) ;; *) echo "::error::Invalid SCALE-7 stage."; exit 1 ;; esac
          case "$profile" in ramp|soak|spike) ;; *) echo "::error::Invalid SCALE-7 profile."; exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Provision governed multi-tenant auth pool when no operator override exists
        if: env.SCALE7_AUTH_CONTEXTS_JSON == ''
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dtsc-scale7"
          oidc_token="$(curl --fail --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${oidc_url}" | jq -r '.value')"
          if [ -z "${oidc_token}" ] || [ "${oidc_token}" = "null" ]; then
            echo "::error::GitHub Actions OIDC token could not be minted."
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          auth_pool="$(curl --fail --silent --show-error             --request POST             --header "Authorization: Bearer ${oidc_token}"             --header "Content-Type: application/json"             --header "Origin: ${BASE_URL%/}"             --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"             --data "$(jq -nc --argjson target "${TARGET_VUS}" '{targetVus:$target}')"             "${BASE_URL%/}/api/internal/scale7/auth-pool")"

          tenant_count="$(jq '.tenants | length' <<<"${auth_pool}")"
          identity_count="$(jq '[.tenants[].sessionCookies[]] | length' <<<"${auth_pool}")"
          if [ "${tenant_count}" -lt 2 ] || [ "${identity_count}" -lt 8 ]; then
            echo "::error::Governed SCALE-7 auth pool is incomplete."
            exit 1
          fi

          echo "::add-mask::${auth_pool}"
          {
            echo 'SCALE7_AUTH_CONTEXTS_JSON<<SCALE7_POOL_EOF'
            echo "${auth_pool}"
            echo 'SCALE7_POOL_EOF'
          } >> "${GITHUB_ENV}"
          echo "SCALE-7 governed auth pool ready: ${tenant_count} tenants / ${identity_count} synthetic identities."

      - name: Enforce staged progression
        run: node scripts/load/verify-scale7-stage-progression.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.1.0

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Capture initial observability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --header "Cookie: ${OBSERVABILITY_COOKIE}"             --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"             "${BASE_URL%/}/api/admin/scalability/observability?windowHours=1"             | jq -c '{generatedAt:.snapshot.generatedAt,api:.snapshot.api,database:.snapshot.database,redis:.snapshot.redis,rateLimit:.snapshot.rateLimit,queues:.snapshot.queues,ai:.snapshot.ai}'             >> artifacts/scale7-observability.ndjson

      - name: Run k6 and sample live infrastructure
        id: load
        shell: bash
        run: |
          set -euo pipefail
          capture_snapshot() {
            curl --fail --silent --show-error               --header "Cookie: ${OBSERVABILITY_COOKIE}"               --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"               "${BASE_URL%/}/api/admin/scalability/observability?windowHours=1"               | jq -c '{generatedAt:.snapshot.generatedAt,api:.snapshot.api,database:.snapshot.database,redis:.snapshot.redis,rateLimit:.snapshot.rateLimit,queues:.snapshot.queues,ai:.snapshot.ai}'               >> artifacts/scale7-observability.ndjson
          }
          (
            while true; do
              capture_snapshot || echo "::warning::A SCALE-7 observability sample failed."
              sleep 15
            done
          ) &
          monitor_pid=$!

          set +e
          k6 run scripts/load/scale7-staged-certification.js
          k6_status=$?
          set -e

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          capture_snapshot || true
          echo "k6_status=${k6_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized certification report
        id: report
        shell: bash
        run: |
          set +e
          node scripts/load/build-scale7-certification-report.mjs
          report_status=$?
          set -e
          echo "report_status=${report_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SCALE-7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale7-${{ github.run_id }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/scale7-k6-summary.json
            artifacts/scale7-observability.ndjson
            artifacts/scale7-certification-report.json
            artifacts/scale7-certification-report.md

      - name: Enforce SCALE-7 stage gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.load.outputs.k6_status }}" != "0" ]; then
            echo "::error::k6 thresholds failed or the staged load did not complete."
            exit 1
          fi
          if [ "${{ steps.report.outputs.report_status }}" != "0" ]; then
            echo "::error::SCALE-7 sanitized certification gates failed."
            exit 1
          fi
          echo "SCALE-7 ${TARGET_VUS} ${LOAD_PROFILE}: PASS"


      - name: Publish owner-triggered sanitized result
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f artifacts/scale7-certification-report.json ]; then
            safe_json="$(jq -c '{
              contract,
              targetVus,
              profile,
              status,
              generatedAt,
              durationSeconds,
              http: {
                requestsPerSecond: .http.requestsPerSecond,
                failedRate: .http.failedRate,
                latencyMs: .http.latencyMs,
                tenantIsolationRate: .http.tenantIsolationRate
              },
              infrastructure: {
                maxDbConnectionUtilization: .infrastructure.maxDbConnectionUtilization,
                redisStatuses: .infrastructure.redisStatuses,
                maxAiActiveAttempts: .infrastructure.maxAiActiveAttempts,
                maxAiThrottledAttempts: .infrastructure.maxAiThrottledAttempts
              },
              githubRunId,
              gitSha,
              evidence
            }' artifacts/scale7-certification-report.json)"
            status="$(jq -r '.status' artifacts/scale7-certification-report.json)"
            body="$(printf 'SCALE-7 owner-triggered run completed — **%s**.\n\nSCALE7_RESULT_JSON\n\x60\x60\x60json\n%s\n\x60\x60\x60\n\nRun: \x60%s\x60 · SHA: \x60%s\x60. This summary is secret-free and contains no tenant/session/provider credential.' "$status" "$safe_json" "$GITHUB_RUN_ID" "$GITHUB_SHA")"
          else
            body="SCALE-7 owner-triggered run ended without a generated sanitized report — run \`${GITHUB_RUN_ID}\`, SHA \`${GITHUB_SHA}\`. No capacity conclusion is recorded."
          fi
          jq -n --arg body "$body" '{body:$body}' |
            curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/360/comments" \
            > /dev/null
