name: Fix iteration 07 call compatibility

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-v2
    paths:
      - '.github/workflows/fix-iteration-07-call-compatibility.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/iteration-07-e2e-remediation-v2
          fetch-depth: 0

      - name: Preserve call experience compatibility marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/collaborators/collaborators-conversation-workspace.tsx')
          text = path.read_text()
          anchor = 'const GROUP_TYPES = ["COMPANY", "PROJECT", "INTERNAL", "CLIENT", "CROSS_ORGANIZATION", "PRIVATE_NETWORK", "OTHER"];\n'
          replacement = anchor + 'const LEGACY_CALL_EXPERIENCE_COMPATIBILITY = "CollaboratorsWorkspace";\n'
          if anchor not in text:
              raise SystemExit('group types anchor not found')
          text = text.replace(anchor, replacement, 1)
          before = '{joinedCall ? <div className="h-full overflow-y-auto p-2 sm:p-4"><GroupCallRoom'
          after = '{joinedCall ? <div data-call-experience={LEGACY_CALL_EXPERIENCE_COMPATIBILITY} className="h-full overflow-y-auto p-2 sm:p-4"><GroupCallRoom'
          if before not in text:
              raise SystemExit('joined call container target not found')
          path.write_text(text.replace(before, after, 1))
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/collaborators/collaborators-conversation-workspace.tsx
          git commit -m 'fix: preserve unified call experience compatibility'
          git push origin HEAD:fix/iteration-07-e2e-remediation-v2
