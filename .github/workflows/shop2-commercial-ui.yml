name: Shop 2 commercial UI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/enterprise-modules/RETAIL_POS/commercial/**"
      - "components/enterprise/professional/retail-commercial-control.tsx"
      - "app/api/enterprise/**/retail/**"
      - "lib/enterprise/retail/**"
      - "scripts/qa-shop2-commercial-ui.mjs"
      - ".github/workflows/shop2-commercial-ui.yml"

permissions:
  contents: read

concurrency:
  group: shop2-commercial-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-contract:
    name: Retail commercial workspace contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Shop 2 commercial workspace
        run: node scripts/qa-shop2-commercial-ui.mjs
