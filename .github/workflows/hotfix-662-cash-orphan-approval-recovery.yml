name: "Hotfix #662 cash orphan approval recovery"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/enterprise/**/cash-sessions/**"
      - "app/api/enterprise/**/retail/daily-close/**"
      - "components/enterprise/enterprise-approver-select.tsx"
      - "components/enterprise/professional/enterprise-finance-cash-workspace.tsx"
      - "components/enterprise/professional/mobile-money-cash-session-manager.tsx"
      - "components/enterprise/professional/retail-daily-close-workspace.tsx"
      - "lib/enterprise/accounting/accounting-approval-schemas.ts"
      - "lib/enterprise/accounting/accounting-operations-approval-orchestration.ts"
      - "lib/enterprise/accounting/http.ts"
      - "lib/enterprise/accounting/treasury-service.ts"
      - "lib/enterprise/retail/http.ts"
      - "lib/enterprise/retail/schemas.ts"
      - "lib/enterprise/retail/service.ts"
      - "locales/enterprise-finance.*.json"
      - "locales/retail-workspace.*.json"
      - "scripts/qa-307-mobile-money-multicurrency.mjs"
      - "scripts/qa-hotfix-662-cash-orphan-approval-recovery.mjs"
      - "tests/e2e/issue-662-cash-orphan-approval-recovery.spec.mjs"
      - "docs/OWNER_E2E_662_CASH_ORPHAN_APPROVAL_RECOVERY.md"
      - "docs/ISSUE_307_MOBILE_MONEY_MULTICURRENCY_ACCOUNTS.md"
      - "docs/ERP_RETAIL_TELCO_MOBILE_MONEY.md"
      - "package.json"
      - ".github/workflows/hotfix-662-cash-orphan-approval-recovery.yml"

permissions:
  contents: read

concurrency:
  group: hotfix-662-cash-orphan-approval-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Orphan cash recovery and assigned daily-close acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_hotfix_662_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_hotfix_662_acceptance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_hotfix_662_acceptance?schema=public
      AUTH_SECRET: hotfix-662-acceptance-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_PUBLIC_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CONSOLE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ACCOUNT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPPORT_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ORGANIZATION_ID: e2e-erp-professional-org
      E2E_ORGANIZATION_CODE: e2e-erp-professional
      E2E_ADMIN_EMAIL: erp-admin@example.test
      E2E_ADMIN_PASSWORD: E2eAdmin2026!
      E2E_USER_EMAIL: erp-user@example.test
      E2E_USER_PASSWORD: E2eUser2026!
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: dtsc-hotfix-662-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REDIS_REST_TOKEN: dtsc-hotfix-662-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start isolated Redis REST proxy
        run: |
          nohup node scripts/ci-upstash-redis-rest-proxy.mjs >/tmp/dtsc-hotfix-662-redis-rest.log 2>&1 &
          echo $! >/tmp/dtsc-hotfix-662-redis-rest.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${CI_REDIS_REST_TOKEN}" http://127.0.0.1:8079/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dtsc-hotfix-662-redis-rest.log
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations from scratch
        run: pnpm prisma:deploy
      - name: Seed canonical ERP acceptance tenant
        run: |
          node scripts/seed-erp-professional-e2e.mjs
          node scripts/seed-shop2-behavioral-e2e.mjs
      - name: Validate hotfix 662 static contract
        run: pnpm qa:hotfix-662
      - name: Run regression QA
        run: pnpm qa:regression
      - name: Type-check
        run: pnpm type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Lint
        run: pnpm lint
      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/dtsc-hotfix-662-build.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production application
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 >/tmp/dtsc-hotfix-662-next.log 2>&1 &
          echo $! >/tmp/dtsc-hotfix-662-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dtsc-hotfix-662-next.log
          exit 1
      - name: "Hotfix #662 browser acceptance"
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/issue-662-cash-orphan-approval-recovery.spec.mjs --workers=1 2>&1 | tee /tmp/dtsc-hotfix-662-browser.log
      - name: Stop application and Redis REST proxy
        if: always()
        run: |
          if [ -f /tmp/dtsc-hotfix-662-next.pid ]; then kill "$(cat /tmp/dtsc-hotfix-662-next.pid)" || true; fi
          if [ -f /tmp/dtsc-hotfix-662-redis-rest.pid ]; then kill "$(cat /tmp/dtsc-hotfix-662-redis-rest.pid)" || true; fi
      - name: Upload hotfix #662 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hotfix-662-cash-orphan-approval-recovery-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            /tmp/dtsc-hotfix-662-build.log
            /tmp/dtsc-hotfix-662-next.log
            /tmp/dtsc-hotfix-662-browser.log
            /tmp/dtsc-hotfix-662-redis-rest.log
