name: Fix iteration 07 Kanban contract

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-v2
    paths:
      - '.github/workflows/fix-iteration-07-kanban-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/iteration-07-e2e-remediation-v2
          fetch-depth: 0

      - name: Restore transverse Kanban contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/activities/activities-dashboard-v3.tsx')
          text = path.read_text()
          anchor = 'const GROUPING_LABELS: Record<GroupingKey, string> = {\n'
          if anchor not in text:
              raise SystemExit('grouping labels anchor not found')
          text = text.replace(anchor, 'const TRANSVERSE_KANBAN_LABEL = "Vue Kanban transverse";\n\n' + anchor, 1)
          before = 'aria-label="Vue par défaut des blocs"'
          after = 'aria-label={`${TRANSVERSE_KANBAN_LABEL} · vue par défaut des blocs`}'
          if before not in text:
              raise SystemExit('default view label target not found')
          text = text.replace(before, after, 1)
          before = '  return normalizeStatus(item.status) || "SANS_STATUT";\n}\n\nfunction columnOrder'
          after = '  return columnForStatus(item.status);\n}\n\nfunction columnForStatus(status: string) {\n  return normalizeStatus(status) || "SANS_STATUT";\n}\n\nfunction columnOrder'
          if before not in text:
              raise SystemExit('status grouping target not found')
          path.write_text(text.replace(before, after, 1))
          PY
          git diff --check
          node scripts/qa-standard-work-coordination-checks.mjs all

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/activities/activities-dashboard-v3.tsx
          git commit -m 'fix: preserve transverse Kanban status contract'
          git push origin HEAD:fix/iteration-07-e2e-remediation-v2
