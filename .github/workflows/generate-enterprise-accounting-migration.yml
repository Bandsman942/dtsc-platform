name: Generate enterprise accounting migration

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/enterprise-accounting.prisma"
      - "prisma/enterprise-finance-reporting.prisma"
      - ".github/workflows/generate-enterprise-accounting-migration.yml"

permissions:
  contents: read

concurrency:
  group: accounting-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
      - name: Checkout main baseline
        uses: actions/checkout@v7
        with:
          ref: main
          path: base-main
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Generate additive SQL from main to branch
        run: >-
          pnpm exec prisma migrate diff
          --from-schema-datamodel base-main/prisma
          --to-schema-datamodel prisma
          --script > enterprise-accounting-migration.sql
      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-accounting-migration
          path: enterprise-accounting-migration.sql
          if-no-files-found: error
