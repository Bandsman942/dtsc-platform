name: AI06 temporary Pharmacy regression fix

on:
  push:
    branches:
      - feat/185-ai06-tool-gateway
    paths:
      - scripts/ai/ai06-pharmacy-regression-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/185-ai06-tool-gateway
          fetch-depth: 0
      - name: Align Pharmacy regression contract
        run: node scripts/ai/fix-ai06-pharmacy-regression.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit regression contract
        run: |
          if git diff --quiet -- scripts/qa-regression-checks.mjs; then
            echo "No regression change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/qa-regression-checks.mjs
          git commit -m "test(ai): align Pharmacy regression with Tool Gateway"
          git push origin HEAD:feat/185-ai06-tool-gateway
