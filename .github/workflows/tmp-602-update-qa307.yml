name: Temporary #602 update QA307

on:
  push:
    branches:
      - feat/602-accounting-atomic-retail-posting
    paths:
      - .github/workflows/tmp-602-update-qa307.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/602-accounting-atomic-retail-posting
      - name: Evolve #307 accounting contract to atomic posting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa-307-mobile-money-multicurrency.mjs')
          s = p.read_text()
          old1 = 'check(manualRoute.includes("finalizeMobileMoneyAccounting"), "Manual Mobile Money operations must finalize accounting");'
          new1 = '''check(hasAll(manualRoute, ["createMobileMoneyTransactionWithPosting", '"MOBILE_MONEY_AGENCY", "submit"']), "Manual Mobile Money operations must enforce submit RBAC and commit business, Treasury and accounting atomically");\ncheck(!manualRoute.includes("finalizeMobileMoneyAccounting"), "Manual Mobile Money operations must not return to two-phase accounting finalization");'''
          old2 = 'check(hasAll(fxRoute, [\'"MOBILE_MONEY_AGENCY", "read"\', \'"MOBILE_MONEY_AGENCY", "manage"\', "mobileMoneyFxPreviewSchema", "mobileMoneyFxTransferSchema", "finalizeMobileMoneyFxAccounting"]), "FX preview/transfer API must enforce RBAC, validation and accounting");'
          new2 = '''check(hasAll(fxRoute, ['"MOBILE_MONEY_AGENCY", "read"', '"MOBILE_MONEY_AGENCY", "manage"', "mobileMoneyFxPreviewSchema", "mobileMoneyFxTransferSchema", "createMobileMoneyFxTransferWithPosting"]), "FX preview/transfer API must enforce RBAC, validation and atomic accounting");\ncheck(!fxRoute.includes("finalizeMobileMoneyFxAccounting"), "FX transfer API must not return to two-phase accounting finalization");'''
          if old1 not in s:
              raise SystemExit('manual Mobile Money #307 marker not found')
          if old2 not in s:
              raise SystemExit('FX #307 marker not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
      - name: Commit QA evolution
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/qa-307-mobile-money-multicurrency.mjs
          git commit -m "test(retail): evolve #307 for atomic posting"
          git push origin HEAD:feat/602-accounting-atomic-retail-posting
