name: Patch 644 checkout build

on:
  push:
    branches:
      - feat/644-gaming-checkout-daily-close

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'apply checkout build patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/644-gaming-checkout-daily-close
          fetch-depth: 0

      - name: Remove unused checkout pagination type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/enterprise/gaming/enterprise-gaming-checkout-workspace.tsx')
          text = path.read_text()
          old = 'type Pagination = { page: number; pageSize: number; total: number; pageCount: number };\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one unused Pagination type, got {count}')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          git rm .github/workflows/patch-644-checkout-build.yml
          git add components/enterprise/gaming/enterprise-gaming-checkout-workspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(gaming): remove checkout build lint error"
          git push origin HEAD:feat/644-gaming-checkout-daily-close
