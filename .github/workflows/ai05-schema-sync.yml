name: AI05 temporary schema sync

on:
  push:
    branches:
      - feat/184-ai05-rag-v2
    paths:
      - scripts/ai/ai05-schema-sync-trigger.txt

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/184-ai05-rag-v2
          fetch-depth: 0

      - name: Apply targeted Prisma schema sync
        run: node scripts/ai/sync-ai05-rag-schema.mjs

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit synchronized schema
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat(ai): sync RAG V2 Prisma schema"
          git push origin HEAD:feat/184-ai05-rag-v2
