name: Append finance documentation

on:
  push:
    branches:
      - feat/erp-consolidation-iteration-03-finance-accounting
    paths:
      - docs/AGENTS_FINANCE_APPEND.md
      - docs/ERP_DOMAIN_ARCHITECTURE_APPEND.md
      - docs/ERP_MODULE_INVENTORY_APPEND.md
      - docs/TECHNICAL_DOCUMENTATION_APPEND.md
      - .github/workflows/append-finance-agents.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/erp-consolidation-iteration-03-finance-accounting
          fetch-depth: 0
      - name: Append durable finance documentation once
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          append_once() {
            local marker="$1"
            local fragment="$2"
            local target="$3"
            test -f "$fragment" || return 0
            if ! grep -q "$marker" "$target"; then
              cat "$fragment" >> "$target"
              changed=1
            fi
          }
          append_once 'ERP_FINANCE_RULES_V1' docs/AGENTS_FINANCE_APPEND.md AGENTS.md
          append_once 'ERP_DOMAIN_ARCHITECTURE_FINANCE_V1' docs/ERP_DOMAIN_ARCHITECTURE_APPEND.md docs/ERP_DOMAIN_ARCHITECTURE.md
          append_once 'ERP_MODULE_INVENTORY_FINANCE_V1' docs/ERP_MODULE_INVENTORY_APPEND.md docs/ERP_MODULE_INVENTORY.md
          append_once 'TECHNICAL_DOCUMENTATION_FINANCE_V1' docs/TECHNICAL_DOCUMENTATION_APPEND.md docs/TECHNICAL_DOCUMENTATION.md
          if [ "$changed" -eq 0 ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/ERP_DOMAIN_ARCHITECTURE.md docs/ERP_MODULE_INVENTORY.md docs/TECHNICAL_DOCUMENTATION.md
          git commit -m 'docs: integrate enterprise finance architecture'
          git push origin HEAD:feat/erp-consolidation-iteration-03-finance-accounting
