name: Apply collaboration commercial readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          ref: chore/apply-collaboration-commercial-readiness
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cat .patches/collaboration-commercial-readiness.* > /tmp/collaboration-commercial-readiness.patch.gz.b64
          echo "5665e24ad158a243137638a9360bb94484f94a2cc763a416c1e7e9a134fdc01e  /tmp/collaboration-commercial-readiness.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/collaboration-commercial-readiness.patch.gz.b64 | gzip -d > /tmp/collaboration-commercial-readiness.patch
          echo "3fc4157e216250c20231a5617652d73f88cab3a99d62b38f8a200e892757672e  /tmp/collaboration-commercial-readiness.patch" | sha256sum -c -

      - name: Apply to exact main and push clean feature branch
        env:
          EXPECTED_MAIN_SHA: e3748eafde536d6ee5566e6a6a30aa8f594861c3
          FEATURE_BRANCH: feat/collaboration-commercial-readiness
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach origin/main
          git apply --check /tmp/collaboration-commercial-readiness.patch
          git apply /tmp/collaboration-commercial-readiness.patch
          git restore --source=origin/main -- .github/workflows/quality-gates.yml
          git switch -c "$FEATURE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete collaboration commercial readiness"
          git push --force-with-lease origin "HEAD:$FEATURE_BRANCH"
