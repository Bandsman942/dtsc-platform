name: AI08 central documentation sync

on:
  push:
    branches:
      - feat/187-ai08-agent-runtime
    paths:
      - .github/workflows/ai08-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI08 branch
        uses: actions/checkout@v7
        with:
          ref: feat/187-ai08-agent-runtime
          fetch-depth: 0

      - name: Patch central documentation without truncating history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path("docs/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## 2026-08-10 — DTSC AI 08/08 : Agent Runtime contrôlé"
          section = '''## 2026-08-10 — DTSC AI 08/08 : Agent Runtime contrôlé

### Ajouté

- Runtime agentique interactif borné au-dessus du Policy Router, du Context Engine, du RAG/CAG et du DTSC Tool Gateway, sans troisième mémoire conversationnelle.
- Modèles `AiAgentRun` et `AiAgentStep` avec limites serveur, progression, outils, tokens, coût estimé, durée active, confirmation, cancellation et reason codes.
- Structured tool calls normalisés pour OpenAI Responses et OpenRouter Chat Completions, toujours exécutés exclusivement via `executeAiTool()`.
- Routes opt-in du Chatbot global et de l’Assistant IA Entreprise, statut de run sûr, cancellation et reprise canonique du même run après confirmation.
- Panneau **Mode agent** commun aux deux assistants avec progression, outils, consommation, confirmation/refus, annulation, reprise, responsive mobile et libellés FR/EN, sans exposition de chaîne de pensée privée.
- Guides utilisateur FR/EN et runbook d’incident/rollback AI08.

### Sécurisé

- Budgets serveur par plan : étapes, appels outils, tokens, coût estimé, durée active, modes et codes outils ; les valeurs client ne peuvent que réduire ces plafonds.
- Autorisation des outils avant exposition au modèle puis revalidation complète au Tool Gateway ; aucune importation dynamique pilotée par le modèle.
- Mutations suspendues jusqu’à confirmation structurelle ; `oui`, `yes`, `ok` ou équivalent n’accordent aucune autorité.
- Reprise uniquement depuis un `AiToolExecution(status=SUCCESS)` chargé côté serveur et claim single-winner du run `READY_TO_RESUME`.
- Refus d’une confirmation : la proposition est annulée et le run lié encore suspendu est clôturé avec `CONFIRMATION_CANCELLED`.
- Domaines sensibles limités à READ/PREPARE et `SENSITIVE_MUTATE` exclu de la baseline AI08 ; aucune décision clinique, paiement/écriture comptable, paie/sanction RH ou engagement juridique final autonome.
- MCP reste subordonné au Tool Gateway, READ-only et fail-closed ; aucun E2E MCP n’est revendiqué sans serveur réellement configuré et certifié.

### Qualité

- Gates AI08 pour runtime/confidentialité, budgets, confirmation, reprise, UX FR/EN/mobile, idempotence, cancellation, isolation tenant et domaines sensibles, intégrées à `scripts/qa-standard-modules-iteration-05.mjs`.
- Correction de deux faux négatifs QA source-level sans affaiblir les contrats : reconnaissance du header `X-AI-Execution` et vérification de l’ordre réel exécution canonique → claim de reprise.
- `Shop 2 global readiness` utilise désormais 6 GiB de heap Node pour son type-check, comme le Quality Gate, après diagnostic d’un OOM V8 à ~4 GiB ; aucune erreur TypeScript n’est masquée.
- Checkpoint AI08 core `266103fd12750f53877f66ade0d92c620ed04907` validé par Quality Gates, migrations, Shop Global, Shop Behavioral et Accounting production-like avant l’ajout de l’UX/documentation finale.

### Maturité

- AI08 reste **non `COMMERCIAL_READY`** tant que le SHA final n’est pas fusionné sur `main`, déployé en Production et validé par les E2E propriétaire requis avec providers/outils/MCP réellement configurés.
'''
          if heading not in text:
              first_section = text.find("\n## ")
              if first_section == -1:
                  text = text.rstrip() + "\n\n" + section + "\n"
              else:
                  text = text[:first_section + 1] + section + "\n" + text[first_section + 1:]
              changelog.write_text(text, encoding="utf-8")

          technical = Path("docs/TECHNICAL_DOCUMENTATION.md")
          tech = technical.read_text(encoding="utf-8")
          tech = tech.replace(
              "**Version :** Consolidation ERP + modules standards 4/8",
              "**Version :** Consolidation ERP + modules standards 8/8 + DTSC AI 08/08",
              1,
          )
          tech_heading = "## Annexe — DTSC AI 08/08 : Agent Runtime contrôlé"
          tech_section = '''## Annexe — DTSC AI 08/08 : Agent Runtime contrôlé

AI08 complète la chaîne Standard AI sans créer de routeur, moteur d’outils ou mémoire conversationnelle parallèle :

```text
Conversation canonique
→ Assistant Runtime / Context Engine / CAG / RAG
→ Policy Router
→ provider certifié
→ structured tool proposal
→ DTSC Tool Gateway
→ résultat audité et traité comme donnée non fiable
→ continuation bornée
→ réponse finale ou suspension/arrêt contrôlé
```

### Sources de vérité

- `lib/ai/agent/*` : policy de run, runtime interactif, persistance, outils, turns et reprise ;
- `AiAgentRun` / `AiAgentStep` : état, plafonds, étapes, outils, provider/modèle, usage, coût, durée et reason codes ;
- `routeAiStream()` : autorité unique de routage provider/modèle/policy ;
- `executeAiTool()` : autorité unique d’exécution outil ;
- `AiToolConfirmation` / `AiToolExecution` : confirmation structurelle et idempotence ;
- `Conversation` / `Message` et `EnterpriseAiConversation` / `EnterpriseAiMessage` : mémoires conversationnelles existantes.

Aucun prompt complet, copie de conversation ou chaîne de pensée privée n’est ajouté aux modèles Agent.

### Surfaces

- `POST /api/chat/agent` : Agent Chatbot global opt-in ;
- `POST /api/enterprise/ai/agent` : Agent Entreprise opt-in ;
- `GET /api/ai/agent/context` : contexte actif minimal dérivé de la session ;
- `GET /api/ai/agent/runs/:id` : statut sûr ;
- `POST /api/ai/agent/runs/:id/cancel` : cancellation ;
- `POST /api/ai/agent/runs/:id/resume` : reprise canonique ;
- `components/chat/ai-agent-run-dock.tsx` : UX commune FR/EN/mobile du mode Agent.

Les routes historiques `/api/chat/v2` et `/api/enterprise/ai/chat` restent indépendantes. Le mode Agent est donc un opt-in produit et non un remplacement implicite du chat existant.

### Budgets, confirmations et sécurité

Chaque run reçoit des plafonds serveur `maxSteps`, `maxToolCalls`, `maxTokens`, `maxEstimatedCost`, `maxDurationMs`, `allowedToolModes` et `allowedToolCodes`. Une demande client ne peut jamais les augmenter.

Une mutation nécessitant confirmation suspend le run en `WAITING_CONFIRMATION`. Après confirmation structurelle réussie, le Tool Gateway produit l’exécution canonique et le run passe `READY_TO_RESUME`. La reprise recharge le résultat côté serveur, revalide tenant, droits, plan, quotas et classifications, puis claim atomiquement le même run. Un refus clôt le run suspendu avec `CONFIRMATION_CANCELLED`.

`SENSITIVE_MUTATE` n’est pas exposé. Pour Health, Finance, RH et Legal sensibles, l’Agent reste limité à READ/PREPARE et les workflows métier canoniques conservent l’autorité finale.

### MCP et Durable Agent

AI08 peut orchestrer uniquement les outils MCP READ déjà certifiés et projetés dans le Tool Gateway. Discovery distante, ressources ou prompts MCP ne deviennent jamais une permission ou une instruction système. `SECRET` ne sort pas vers MCP/provider externe.

La classe `DURABLE` reste réservée mais inactive. DTSC ne simule pas un agent background par une requête HTTP longue ; tout raccord durable futur doit réutiliser une infrastructure de worker réellement persistante et disposer de ses propres contrats/QA.

### Observabilité et UX

L’interface affiche uniquement l’état sûr du run : progression, outils, plafonds, tokens, coût estimé, confirmations, reason codes, annulation et reprise. Elle n’affiche ni prompts, ni arguments bruts, ni raisonnement privé.

Les traces provider (`AiProviderAttempt`), appels modèle (`AiModelCall`), exécutions outil (`AiToolExecution`), audits MCP et runs/steps Agent restent complémentaires afin de conserver la provenance sans double comptage fonctionnel.

### Validation et maturité

Les gates AI08 couvrent runtime/confidentialité, budgets, confirmation, reprise, UX FR/EN/mobile, idempotence, cancellation, isolation tenant et domaines sensibles. Elles sont intégrées à la régression Standard AI.

`COMMERCIAL_READY` reste interdit sans preuve sur le SHA `main` réellement déployé en Production : E2E Chatbot Agent, Assistant Entreprise, CAG+RAG, OpenRouter/fallback, READ, PREPARE, MUTATE confirmé/repris, MCP READ réellement configuré, cancellation et refus sensitive/cross-tenant.

Documents détaillés :

- `docs/STANDARD_AI_AGENT_RUNTIME.md` ;
- `docs/STANDARD_AI_AGENT_RUNBOOK.md` ;
- `docs/STANDARD_AI_TOOL_GATEWAY.md` ;
- `docs/STANDARD_AI_MCP_ARCHITECTURE.md` ;
- `docs/STANDARD_AI_ORCHESTRATION_ARCHITECTURE.md` ;
- `docs/STANDARD_AI_OBSERVABILITY_MODEL.md` ;
- `docs/user-guides/AI_AGENT_MODE_FR.md` ;
- `docs/user-guides/AI_AGENT_MODE_EN.md`.
'''
          if tech_heading not in tech:
              tech = tech.rstrip() + "\n\n" + tech_section + "\n"
          technical.write_text(tech, encoding="utf-8")
          PY

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md docs/TECHNICAL_DOCUMENTATION.md
          git rm .github/workflows/ai08-doc-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(ai): complete AI08 central documentation"
          git push origin HEAD:feat/187-ai08-agent-runtime
