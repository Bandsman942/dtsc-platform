name: Temporary #313 Enterprise coordination i18n codemod

on:
  push:
    branches:
      - refactor/313-enterprise-coordination-i18n
    paths:
      - scripts/tmp-313-enterprise-coordination-i18n-codemod.mjs
      - scripts/tmp-313-enterprise-coordination-i18n-fixup.mjs
      - .github/workflows/tmp-313-enterprise-coordination-i18n.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/313-enterprise-coordination-i18n
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical Enterprise Core coordination i18n codemod
        run: |
          node scripts/tmp-313-enterprise-coordination-i18n-codemod.mjs
          node scripts/tmp-313-enterprise-coordination-i18n-fixup.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/enterprise/core-v2 locales/enterprise-core.fr.json locales/enterprise-core.en.json
          git commit -m "refactor(i18n): finish Enterprise coordination convergence"
          git push origin HEAD:refactor/313-enterprise-coordination-i18n
