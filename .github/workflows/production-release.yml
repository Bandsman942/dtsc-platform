name: Production release

on:
  deployment_status:

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: production-release-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Production release
    if: >-
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      (github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Production SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate native Vercel Production status and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github/release-production.mjs
