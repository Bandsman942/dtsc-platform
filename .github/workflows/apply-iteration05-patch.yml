name: Apply iteration 05 patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/iteration05-parts/**"
      - ".github/workflows/apply-iteration05-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify and apply iteration patch
        run: |
          cat .github/iteration05-parts/* > /tmp/iteration05.patch.xz.b64
          wc -c .github/iteration05-parts/* /tmp/iteration05.patch.xz.b64
          sha256sum .github/iteration05-parts/*
          echo "183419bb3efdf0fc160a007470694297203a2710f5b794c8ee5e287abe640d12  /tmp/iteration05.patch.xz.b64" | sha256sum --check -
          base64 --decode /tmp/iteration05.patch.xz.b64 | xz --decompress > /tmp/iteration05.patch
          echo "d28381401bafa25dcd9bc22361d22d41c795259aa43d735e65923589636c9488  /tmp/iteration05.patch" | sha256sum --check -
          git apply --index --whitespace=error-all /tmp/iteration05.patch
          git rm -r .github/iteration05-parts
          git rm .github/iteration05.patch.xz.b64 .github/workflows/apply-iteration05-patch.yml

      - name: Publish implementation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: professionalize DTSC AI and commercial maturity governance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
