name: Apply iteration 04 lint fixes

on:
  push:
    branches:
      - fix/iteration-04-owner-e2e-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iteration-04-owner-e2e-remediation
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source fixes
        run: node scripts/apply-iteration04-lint-fixes.mjs
      - name: Commit source fixes
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/calendar/resources/reservations/route.ts app/api/operations/sla/route.ts components/admin/dtsc-individual-permissions-panel.tsx components/admin/operational-sla-panel.tsx components/calendar/calendar-advanced-tools-panel.tsx components/calendar/internal-calendar-workspace-v2.tsx components/enterprise/enterprise-activities-module.tsx
          git commit -m "fix(lint): normalize iteration 04 source"
          git push origin HEAD:fix/iteration-04-owner-e2e-remediation
