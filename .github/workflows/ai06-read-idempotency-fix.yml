name: AI06 temporary READ idempotency fix

on:
  push:
    branches:
      - feat/185-ai06-tool-gateway
    paths:
      - scripts/ai/ai06-read-idempotency-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch-read-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/185-ai06-tool-gateway
          fetch-depth: 0
      - name: Fix READ idempotency semantics
        run: node scripts/ai/fix-ai06-read-idempotency.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit runtime fix
        run: |
          if git diff --quiet -- lib/ai/tool-registry.ts lib/ai/tools/execute.ts scripts/qa-standard-ai-tool-gateway.mjs; then
            echo "No runtime change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/tool-registry.ts lib/ai/tools/execute.ts scripts/qa-standard-ai-tool-gateway.mjs
          git commit -m "fix(ai): keep Tool Gateway reads fresh"
          git push origin HEAD:feat/185-ai06-tool-gateway
