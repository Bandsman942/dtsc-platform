name: Apply iteration 07 owner E2E remediation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-iteration-07-owner-e2e-remediation.yml'
      - '.transfer/iteration07/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/iteration-07-e2e-remediation-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and apply verified patch
        run: |
          set -euo pipefail
          truncate -s 7500 .transfer/iteration07/chunk-08
          cat > /tmp/iteration07-chunks.sha256 <<'CHECKSUMS'
          7b54da824479ef9fec738bdf4f05e15d21f8864601b80d5094c8bf0f55559646  .transfer/iteration07/chunk-00
          9dc86c0e594cabc468fc8733abebbc54a9ea882a3cdbbc8c5506a3f401b4ea75  .transfer/iteration07/chunk-01
          bc7e42883343491b0690ab6fb041cc0fcd0ba748346221ecd11d22355bf21f03  .transfer/iteration07/chunk-02
          6e3e3816529599a4ea72aefb6cd207d81141f913883d79a6add22808c67c5417  .transfer/iteration07/chunk-03
          45618254e3c35729fac23d53a65c881b1b3e03abadc7a4e4c220426c6948f171  .transfer/iteration07/chunk-04
          55cbd7bb0abcd6ef57680dc23185e6dbbbdfbe736692c4e24c46d5ecca122f8d  .transfer/iteration07/chunk-05
          7261f27f725bbbbef99e1dac343e0ea174c91d85ac0ae8c52de3a963140057f3  .transfer/iteration07/chunk-06a
          eec8432141c54c368d379b732d6fe3d38298af090df7b44a9eb9582477a71f96  .transfer/iteration07/chunk-06b1
          77a0ef2c55ca0d094909677ca735a42b9100be5df28a2f73483f7db62121a300  .transfer/iteration07/chunk-06b2
          de0bc69170d5896e96a7f831aee00434ca6171cb59c32aa63d0c91969f5be979  .transfer/iteration07/chunk-06b3
          bf0dd8149127054b7c05922aceb40300bc33c7eb6b21103df6c9e15d23581861  .transfer/iteration07/chunk-06b4
          33ade00d7efd8a0581b3cb2a1e76a6b774f7ab38d3c4c3f60e6821da43cbe991  .transfer/iteration07/chunk-06b5
          e76badfe55c82267c84126fa14098264375fb60a3130cb906cdbaa4295ca4444  .transfer/iteration07/chunk-06c
          41dcde582402e774e894c47a868884ebd39d4d83e78a0c6bbadf2f5ebd5ad3dc  .transfer/iteration07/chunk-07
          a1c3d039673dcdfd3f65a98abb4aab1625356e6a9a75498f2a80378dc52e2e3d  .transfer/iteration07/chunk-08
          fdf16e2b7abbeeee24302a04d1c0fd191fb3b2adace96f0be55bbb29a6ac70a9  .transfer/iteration07/chunk-09
          8f8080a9fd765bfdf6d839410c8395e605efa3a58be421f6ef92d6f544dee242  .transfer/iteration07/chunk-10
          4f615c50ce3988ae98c31aac3942303d0c53b8c0aa8ba5391e053994f6e3a2a1  .transfer/iteration07/chunk-11
          CHECKSUMS
          sha256sum -c /tmp/iteration07-chunks.sha256
          cat .transfer/iteration07/chunk-* > /tmp/iteration07.patch.gz.b64
          test "$(wc -c < /tmp/iteration07.patch.gz.b64)" -eq 82992
          printf '%s  %s\n' 'fc2ff9314013d8a439bb18c3edaa770c799b74693ab3463982d74bdd59de3cf4' '/tmp/iteration07.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/iteration07.patch.gz.b64 > /tmp/iteration07.patch.gz
          gzip -dc /tmp/iteration07.patch.gz > /tmp/iteration07.patch
          git apply --index --whitespace=error /tmp/iteration07.patch
          # GitHub Actions ne possède pas la permission workflows. Le Quality Gate sera appliqué ensuite via l'API GitHub autorisée.
          git restore --source=HEAD --staged --worktree .github/workflows/quality-gates.yml
          rm -rf .transfer
          git add -A
          git diff --cached --check

      - name: Commit applied implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: implement iteration 07 owner E2E remediation'
          git push origin HEAD:${{ github.head_ref }}
