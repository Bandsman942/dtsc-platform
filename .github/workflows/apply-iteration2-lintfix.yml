name: Apply iteration 2 lint fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/iteration2-lintfix/**"
      - ".github/workflows/apply-iteration2-lintfix.yml"

permissions:
  contents: write

concurrency:
  group: apply-iteration2-lintfix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/erp-professionalization-iteration-02-crm-master-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/erp-professionalization-iteration-02-crm-master-data
          fetch-depth: 0

      - name: Verify patch
        run: |
          echo "f9049d25379ec84bda5948e0385d589fdea0fefc0518a0b4253b6cc63f583170  .github/iteration2-lintfix/lintfix.patch" | sha256sum -c -
          git apply --check .github/iteration2-lintfix/lintfix.patch

      - name: Apply and publish lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index .github/iteration2-lintfix/lintfix.patch
          git rm -r .github/iteration2-lintfix .github/workflows/apply-iteration2-lintfix.yml
          git commit -m "fix: remove professional ERP lint dead code"
          git push origin HEAD:feat/erp-professionalization-iteration-02-crm-master-data
