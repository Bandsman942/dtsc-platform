name: PR291 materialize collaborator i18n

on:
  push:
    branches:
      - refactor/277-collaborator-dialog-i18n-final
    paths:
      - ".github/workflows/pr291-export-generated-i18n.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/277-collaborator-dialog-i18n-final
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical collaborator i18n codemod
        run: node scripts/__temp-apply-collaborator-i18n-277.mjs
      - name: Converge historical owner-E2E QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/qa-iteration-07-owner-e2e-remediation-v3.mjs")
          text = path.read_text()
          old = 'requireText("components/collaborators/collaborators-conversation-workspace.tsx", ["initialContacts", "Mes contacts", "historyExpandedRef", "previousHeight"]);'
          new = '''requireText("components/collaborators/collaborators-conversation-workspace.tsx", [
            "initialContacts",
            'TabsTrigger value="contacts"',
            "collaborationExperienceT",
            "historyExpandedRef",
            "previousHeight",
          ]);'''
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit("historical collaborator assertion not found")
          PY
      - name: Remove generation-only hooks
        shell: bash
        run: |
          git checkout origin/main -- scripts/audit-standard-collaboration-e2e-fixes.mjs
          rm -f scripts/__temp-apply-collaborator-i18n-277.mjs
          rm -f .tmp-277-canonicalized
          rm -f .github/workflows/pr291-export-generated-i18n.yml
      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 1; }
          git commit -m "refactor(i18n): materialize collaborator dialog convergence"
          git push origin HEAD:refactor/277-collaborator-dialog-i18n-final
