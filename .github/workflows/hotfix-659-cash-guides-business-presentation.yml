name: Hotfix #659 cash, guides and business presentation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/enterprise/**/cash-sessions/**"
      - "app/api/enterprise/**/approvals/**"
      - "app/help/enterprise/page.tsx"
      - "components/enterprise/core-v2/enterprise-approvals-workspace.tsx"
      - "components/enterprise/professional/cash-physical-count-fields.tsx"
      - "components/enterprise/professional/enterprise-finance-cash-workspace.tsx"
      - "components/enterprise/professional/mobile-money-cash-session-manager.tsx"
      - "components/user-guides/contextual-user-guide.tsx"
      - "lib/enterprise/accounting/accounting-approval-service.ts"
      - "lib/enterprise/approval-presentation.ts"
      - "lib/enterprise/approval-targets.ts"
      - "lib/standard-work-coordination/**"
      - "lib/user-guides/**"
      - "scripts/qa-hotfix-659-cash-guides-business-presentation.mjs"
      - "tests/e2e/issue-659-cash-guides-business-presentation.spec.mjs"
      - "package.json"
      - ".github/workflows/hotfix-659-cash-guides-business-presentation.yml"

permissions:
  contents: read

concurrency:
  group: hotfix-659-cash-guides-business-presentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Cash assignment, guide convergence and business-language acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_hotfix_659_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_hotfix_659_acceptance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_hotfix_659_acceptance?schema=public
      AUTH_SECRET: hotfix-659-acceptance-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_PUBLIC_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CONSOLE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ACCOUNT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPPORT_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ORGANIZATION_ID: e2e-erp-professional-org
      E2E_ORGANIZATION_CODE: e2e-erp-professional
      E2E_ADMIN_EMAIL: erp-admin@example.test
      E2E_ADMIN_PASSWORD: E2eAdmin2026!
      E2E_USER_EMAIL: erp-user@example.test
      E2E_USER_PASSWORD: E2eUser2026!
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: dtsc-hotfix-659-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REDIS_REST_TOKEN: dtsc-hotfix-659-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start isolated Redis REST proxy
        run: |
          nohup node scripts/ci-upstash-redis-rest-proxy.mjs >/tmp/dtsc-hotfix-659-redis-rest.log 2>&1 &
          echo $! >/tmp/dtsc-hotfix-659-redis-rest.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${CI_REDIS_REST_TOKEN}" http://127.0.0.1:8079/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dtsc-hotfix-659-redis-rest.log
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations from scratch
        run: pnpm prisma:deploy
      - name: Seed canonical ERP acceptance tenant
        run: |
          node scripts/seed-erp-professional-e2e.mjs
          node scripts/seed-shop2-behavioral-e2e.mjs
      - name: Validate hotfix 659 static contract
        run: pnpm qa:hotfix-659
      - name: Run regression QA
        run: pnpm qa:regression
      - name: Type-check
        run: pnpm type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Lint
        run: pnpm lint
      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/dtsc-hotfix-659-build.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production application
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 >/tmp/dtsc-hotfix-659-next.log 2>&1 &
          echo $! >/tmp/dtsc-hotfix-659-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dtsc-hotfix-659-next.log
          exit 1
      - name: Hotfix #659 browser acceptance
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/issue-659-cash-guides-business-presentation.spec.mjs --workers=1 2>&1 | tee /tmp/dtsc-hotfix-659-browser.log
      - name: Stop application and Redis REST proxy
        if: always()
        run: |
          if [ -f /tmp/dtsc-hotfix-659-next.pid ]; then kill "$(cat /tmp/dtsc-hotfix-659-next.pid)" || true; fi
          if [ -f /tmp/dtsc-hotfix-659-redis-rest.pid ]; then kill "$(cat /tmp/dtsc-hotfix-659-redis-rest.pid)" || true; fi
      - name: Upload hotfix #659 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hotfix-659-cash-guides-business-presentation-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            /tmp/dtsc-hotfix-659-build.log
            /tmp/dtsc-hotfix-659-next.log
            /tmp/dtsc-hotfix-659-browser.log
            /tmp/dtsc-hotfix-659-redis-rest.log
