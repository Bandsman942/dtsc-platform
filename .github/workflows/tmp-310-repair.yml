name: Temporary

on:
  push:
    branches:
      - fix/307-mobile-money-multicurrency-accounts

permissions:
  contents: write

jobs:
  repair-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/307-mobile-money-multicurrency-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair codemod quoting
        shell: python
        run: |
          from pathlib import Path
          file = Path("scripts/tmp-310-telco-multicurrency-codemod.mjs")
          source = file.read_text()
          replacements = {
              '      `/api/enterprise/¤{organizationId}/retail/telco-topups`,': '      §/api/enterprise/¤{organizationId}/retail/telco-topups§,',
              '      `telco-account-¤{provider.id}-¤{currencyCode}`,': '      §telco-account-¤{provider.id}-¤{currencyCode}§,',
              '      `/api/enterprise/¤{organizationId}/retail/telco-topups/accounts`,': '      §/api/enterprise/¤{organizationId}/retail/telco-topups/accounts§,',
              '  telcoDocs + "## Sessions de caisse"': '  telcoDocs',
              '  "Compte opérateur Télécom par devise",': '  "Comptes opérateur Télécom par devise",',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"repair marker missing: {old}")
              source = source.replace(old, new)
          file.write_text(source)
      - name: Validate repaired codemod syntax
        run: node --check scripts/tmp-310-telco-multicurrency-codemod.mjs
      - name: Apply Telco multi-currency implementation
        run: node scripts/tmp-310-telco-multicurrency-codemod.mjs
      - name: Commit generated implementation
        run: |
          rm -f .github/workflows/tmp-310-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(retail): support multi-currency Telco operator accounts"
          git push origin HEAD:fix/307-mobile-money-multicurrency-accounts
