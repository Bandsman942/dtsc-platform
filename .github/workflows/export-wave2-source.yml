name: Export wave 2 source

on:
  push:
    branches:
      - fix/iteration-07-e2e-remediation-wave-2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - name: Archive source
        run: tar -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/dtsc-platform-wave2-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: dtsc-platform-wave2-source
          path: ${{ runner.temp }}/dtsc-platform-wave2-source.tar.gz
          retention-days: 1
