name: Fix iteration 07 personal invoice user

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-iteration-07-personal-invoice-user.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/iteration-07-e2e-remediation-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Tighten personal invoice user id
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/subscription-payments.ts')
          text = path.read_text()
          before = 'number: buildInvoiceNumber(), userId: request.userId, planId:'
          after = 'number: buildInvoiceNumber(), userId: request.userId!, planId:'
          if before not in text:
              raise SystemExit('personal invoice user target not found')
          path.write_text(text.replace(before, after, 1))
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/subscription-payments.ts
          git commit -m 'fix: require user id for personal subscription invoice'
          git push origin HEAD:${{ github.head_ref }}
