name: Export standard iteration 06 source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-standard-iteration-06-source.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: |
          git archive --format=zip --output=dtsc-platform-standard-iteration-06-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dtsc-platform-standard-iteration-06-source
          path: dtsc-platform-standard-iteration-06-source.zip
          if-no-files-found: error
          retention-days: 1
