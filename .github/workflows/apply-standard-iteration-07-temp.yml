name: Apply standard iteration 07 source

on:
  push:
    branches:
      - feat/standard-modules-professionalization-iteration-07-dtsc-console
    paths:
      - '.github/workflows/apply-standard-iteration-07-temp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/standard-modules-professionalization-iteration-07-dtsc-console
          fetch-depth: 0

      - name: Reconstruct and apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .iteration07/chunk-* > /tmp/iteration07.patch.xz.b64
          base64 --decode /tmp/iteration07.patch.xz.b64 > /tmp/iteration07.patch.xz
          xz --decompress /tmp/iteration07.patch.xz
          git apply --check /tmp/iteration07.patch
          git apply /tmp/iteration07.patch
          git checkout -- .github/workflows/quality-gates.yml
          rm -rf .iteration07

      - name: Commit professional Console implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: professionalize the DTSC SaaS administration console"
          git push origin HEAD:feat/standard-modules-professionalization-iteration-07-dtsc-console
