name: SCALE-1B database load evidence

on:
  workflow_dispatch:
    inputs:
      target_vus:
        description: Intermediate virtual-user target
        required: true
        default: "500"
        type: choice
        options:
          - "100"
          - "250"
          - "500"
      confirmation:
        description: Type RUN_SCALE1_DB_LOAD to confirm the bounded Production load run
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: scale1-db-load
  cancel-in-progress: false

jobs:
  intermediate-db-load:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 410 &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == 'RUN_SCALE1_DB_LOAD_500')
    name: Intermediate PostgreSQL load evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.SCALE1_LOAD_BASE_URL }}
      SESSION_COOKIE: ${{ secrets.SCALE1_LOAD_SESSION_COOKIE }}
      OBSERVABILITY_COOKIE: ${{ secrets.SCALE1_CTO_SESSION_COOKIE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '500' }}
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Validate manual load contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirmation }}" != "RUN_SCALE1_DB_LOAD" ]; then
              echo "::error::Confirmation must be RUN_SCALE1_DB_LOAD."
              exit 1
            fi
          else
            if [ "${{ github.event.issue.number }}" != "410" ] || \
               [ "${{ github.event.comment.author_association }}" != "OWNER" ] || \
               [ "${{ github.event.comment.body }}" != "RUN_SCALE1_DB_LOAD_500" ]; then
              echo "::error::Issue-comment load trigger is not authorized."
              exit 1
            fi
          fi
          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::Repository variable SCALE1_LOAD_BASE_URL is required."
            exit 1
          fi
          if [ -z "${SESSION_COOKIE:-}" ]; then
            echo "::error::Secret SCALE1_LOAD_SESSION_COOKIE is required."
            exit 1
          fi
          if [ -z "${OBSERVABILITY_COOKIE:-}" ]; then
            echo "::error::Secret SCALE1_CTO_SESSION_COOKIE is required."
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::Secret VERCEL_AUTOMATION_BYPASS_SECRET is required."
            exit 1
          fi
          echo "::add-mask::${VERCEL_AUTOMATION_BYPASS_SECRET}"
          case "$TARGET_VUS" in
            100|250|500) ;;
            *) echo "::error::target_vus must be 100, 250 or 500."; exit 1 ;;
          esac
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::SCALE1_LOAD_BASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Publish owner-triggered run identity
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="SCALE-1B 500 VU started — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`. Evidence is pending; no PASS is claimed until the final artifact and gates are available."
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/410/comments" \
            > /dev/null

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.1.0

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Authenticated preflight and initial DB snapshot
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Cookie: ${SESSION_COOKIE}" \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${BASE_URL%/}/api/notifications/unread-count")"
          if [ "$status" != "200" ]; then
            echo "::error::Authenticated load preflight returned HTTP ${status}."
            exit 1
          fi

          curl --fail --silent --show-error \
            --header "Cookie: ${OBSERVABILITY_COOKIE}" \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${BASE_URL%/}/api/admin/scalability/observability?windowHours=1" \
            | jq -c '{generatedAt:.snapshot.generatedAt,database:.snapshot.database}' \
            >> artifacts/db-observability.ndjson

      - name: Run bounded k6 load and sample PostgreSQL pressure
        id: load
        shell: bash
        run: |
          set -euo pipefail

          capture_db_snapshot() {
            curl --fail --silent --show-error \
              --header "Cookie: ${OBSERVABILITY_COOKIE}" \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${BASE_URL%/}/api/admin/scalability/observability?windowHours=1" \
              | jq -c '{generatedAt:.snapshot.generatedAt,database:.snapshot.database}' \
              >> artifacts/db-observability.ndjson
          }

          (
            while true; do
              capture_db_snapshot || echo "::warning::A PostgreSQL observability sample failed."
              sleep 15
            done
          ) &
          monitor_pid=$!

          set +e
          k6 run scripts/load/scale1-db-intermediate.js
          k6_status=$?
          set -e

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          capture_db_snapshot || true

          echo "k6_status=${k6_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized SCALE-1B report
        id: report
        shell: bash
        run: |
          set +e
          node scripts/load/build-scale1-db-report.mjs
          report_status=$?
          set -e
          echo "report_status=${report_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SCALE-1B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale1-db-load-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '500' }}vu
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/k6-summary.json
            artifacts/db-observability.ndjson
            artifacts/scale1-db-load-report.json
            artifacts/scale1-db-load-report.md

      - name: Enforce SCALE-1B gates
        id: gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          k6_status="${{ steps.load.outputs.k6_status }}"
          report_status="${{ steps.report.outputs.report_status }}"
          if [ -z "$k6_status" ] || [ "$k6_status" != "0" ]; then
            echo "::error::k6 SCALE-1B thresholds failed or the load run did not complete."
            exit 1
          fi
          if [ -z "$report_status" ] || [ "$report_status" != "0" ]; then
            echo "::error::SCALE-1B database evidence gates failed."
            exit 1
          fi
          echo "SCALE-1B intermediate PostgreSQL load evidence: PASS"

      - name: Publish owner-triggered sanitized result
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f artifacts/scale1-db-load-report.json ]; then
            status="$(jq -r '.status' artifacts/scale1-db-load-report.json)"
            requests="$(jq -r '.http.requests // "n/a"' artifacts/scale1-db-load-report.json)"
            rps="$(jq -r '.http.requestsPerSecond // "n/a"' artifacts/scale1-db-load-report.json)"
            failures="$(jq -r '.http.failedRate // "n/a"' artifacts/scale1-db-load-report.json)"
            checks="$(jq -r '.http.checksRate // "n/a"' artifacts/scale1-db-load-report.json)"
            p95="$(jq -r '.http.latencyMs.p95 // "n/a"' artifacts/scale1-db-load-report.json)"
            p99="$(jq -r '.http.latencyMs.p99 // "n/a"' artifacts/scale1-db-load-report.json)"
            dashboard_p95="$(jq -r '.http.workloadLatencyMs.dashboardRead.p95 // "n/a"' artifacts/scale1-db-load-report.json)"
            dashboard_p99="$(jq -r '.http.workloadLatencyMs.dashboardRead.p99 // "n/a"' artifacts/scale1-db-load-report.json)"
            notifications_p95="$(jq -r '.http.workloadLatencyMs.notificationsRead.p95 // "n/a"' artifacts/scale1-db-load-report.json)"
            notifications_p99="$(jq -r '.http.workloadLatencyMs.notificationsRead.p99 // "n/a"' artifacts/scale1-db-load-report.json)"
            db_connections="$(jq -r '.database.maxCurrentConnections // "n/a"' artifacts/scale1-db-load-report.json)"
            db_max="$(jq -r '.database.maxConnections // "n/a"' artifacts/scale1-db-load-report.json)"
            db_util="$(jq -r '.database.maxConnectionUtilization // "n/a"' artifacts/scale1-db-load-report.json)"
            connection_limit="$(jq -r '.database.connectionLimits | join(",")' artifacts/scale1-db-load-report.json)"
            failed_gates="$(jq -r 'if (.failedGates|length)==0 then "none" else (.failedGates|join(", ")) end' artifacts/scale1-db-load-report.json)"
            body=$(cat <<EOF
          SCALE-1B 500 VU completed — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`.

          Sanitized report: **${status}**. Requests=${requests}; req/s=${rps}; HTTP failure rate=${failures}; checks=${checks}; aggregate P95/P99=${p95}/${p99} ms; dashboard P95/P99=${dashboard_p95}/${dashboard_p99} ms; notifications P95/P99=${notifications_p95}/${notifications_p99} ms; DB max connections=${db_connections}/${db_max}; max utilization=${db_util}; connection_limit=${connection_limit:-n/a}; failed gates=${failed_gates}.

          Artifact is attached to GitHub Actions run \`${GITHUB_RUN_ID}\`. This comment contains no session, bypass secret, DSN, hostname, SQL text or tenant/user identifier.
          EOF
          )
          else
            body="SCALE-1B 500 VU ended without a generated sanitized report — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`. Inspect the run before drawing any capacity conclusion."
          fi
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/410/comments" \
            > /dev/null
