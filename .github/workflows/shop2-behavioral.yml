name: Shop 2 behavioral gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/enterprise/**/retail/**"
      - "app/api/enterprise/**/sales-orders/**"
      - "app/enterprise-modules/retail-page.tsx"
      - "components/enterprise/professional/retail-*.tsx"
      - "lib/enterprise/retail/**"
      - "lib/retail-customer-language.ts"
      - "lib/enterprise/inventory/reservations.ts"
      - "lib/enterprise/inventory/service.ts"
      - "lib/enterprise/crm-sales/orders.ts"
      - "lib/enterprise/crm-sales/fulfillments.ts"
      - "lib/enterprise/accounting/**"
      - "lib/enterprise/module-registry-retail.json"
      - "lib/auth.ts"
      - "lib/session-cookie-security.ts"
      - "middleware.ts"
      - "prisma/enterprise-retail.prisma"
      - "prisma/enterprise-retail-customer-payments.prisma"
      - "prisma/enterprise-retail-offline-omnichannel.prisma"
      - "prisma/enterprise-inventory-reservations.prisma"
      - "prisma/enterprise-accounting.prisma"
      - "prisma/enterprise-inventory.prisma"
      - "prisma/enterprise-crm-sales.prisma"
      - "prisma/migrations/**"
      - "tests/e2e/shop2-retail.spec.mjs"
      - "tests/e2e/shop2-commercial.spec.mjs"
      - "tests/e2e/shop2-customer-payments.spec.mjs"
      - "tests/e2e/shop2-customer-value-ui.spec.mjs"
      - "tests/e2e/shop2-daily-close-ui.spec.mjs"
      - "tests/e2e/shop2-final-coherence-ui.spec.mjs"
      - "tests/e2e/shop2-z-global.spec.mjs"
      - "playwright.config.mjs"
      - "scripts/seed-shop2-behavioral-e2e.mjs"
      - "scripts/seed-shop2-commercial-e2e.mjs"
      - "scripts/qa-shop2-inventory-schema-parity.mjs"
      - "scripts/qa-shop2-retail-frontend-contract.mjs"
      - "scripts/qa-shop2-commercial-engine.mjs"
      - "scripts/qa-shop2-customer-payments.mjs"
      - "scripts/qa-shop2-global-readiness.mjs"
      - "scripts/qa-shop2-fulfillment-reservations.mjs"
      - "scripts/qa-shop2-active-customer-cookie.mjs"
      - "scripts/qa-session-cookie-security.mjs"
      - "scripts/qa-retail-product-coherence.mjs"
      - "scripts/ci-upstash-redis-rest-proxy.mjs"
      - "scripts/qa-ci-auth-rate-limit-provisioning.mjs"
      - ".github/workflows/shop2-behavioral.yml"

permissions:
  contents: read

concurrency:
  group: shop2-behavioral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral:
    name: Retail POS accounting, concurrency, payments & global readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_shop2_behavioral
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_shop2_behavioral"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_shop2_behavioral?schema=public
      AUTH_SECRET: shop2-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_PUBLIC_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CONSOLE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ACCOUNT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPPORT_URL: http://127.0.0.1:3000
      CRON_SECRET: shop2-cron-secret-with-more-than-twenty-four-characters
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ORGANIZATION_ID: e2e-erp-professional-org
      E2E_ORGANIZATION_CODE: e2e-erp-professional
      E2E_ADMIN_EMAIL: erp-admin@example.test
      E2E_ADMIN_PASSWORD: E2eAdmin2026!
      E2E_USER_EMAIL: erp-user@example.test
      E2E_USER_PASSWORD: E2eUser2026!
      E2E_CRON_SECRET: shop2-cron-secret-with-more-than-twenty-four-characters
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: dtsc-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REDIS_REST_TOKEN: dtsc-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start isolated Redis REST proxy
        run: |
          nohup node scripts/ci-upstash-redis-rest-proxy.mjs >/tmp/dtsc-ci-redis-rest.log 2>&1 &
          echo $! >/tmp/dtsc-ci-redis-rest.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CI_REDIS_REST_TOKEN}" \
              http://127.0.0.1:8079/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dtsc-ci-redis-rest.log
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations from scratch
        run: pnpm prisma:deploy
      - name: Verify Shop 2 inventory schema parity
        run: node scripts/qa-shop2-inventory-schema-parity.mjs
      - name: Seed canonical ERP acceptance tenant
        run: node scripts/seed-erp-professional-e2e.mjs
      - name: Seed canonical Shop 2 behavioral tenant
        run: node scripts/seed-shop2-behavioral-e2e.mjs
      - name: Seed Shop 2 commercial acceptance data
        run: node scripts/seed-shop2-commercial-e2e.mjs
      - name: Validate Shop 2 static contracts
        run: |
          node scripts/qa-retail-telco-mobile-money.mjs
          node scripts/qa-shop2-retail-frontend-contract.mjs
          node scripts/qa-shop2-commercial-engine.mjs
          node scripts/qa-shop2-customer-payments.mjs
          node scripts/qa-shop2-global-readiness.mjs
          node scripts/qa-shop2-fulfillment-reservations.mjs
          node scripts/qa-shop2-active-customer-cookie.mjs
          node scripts/qa-retail-product-coherence.mjs
          node --experimental-strip-types scripts/qa-session-cookie-security.mjs
          node scripts/qa-ci-auth-rate-limit-provisioning.mjs
      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/dtsc-shop2-build.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production application
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 >/tmp/dtsc-shop2-next.log 2>&1 &
          echo $! >/tmp/dtsc-shop2-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dtsc-shop2-next.log
          exit 1
      - name: Shop 2 POS behavioral acceptance
        run: pnpm exec playwright test tests/e2e/shop2-retail.spec.mjs tests/e2e/shop2-commercial.spec.mjs tests/e2e/shop2-customer-payments.spec.mjs tests/e2e/shop2-customer-value-ui.spec.mjs tests/e2e/shop2-daily-close-ui.spec.mjs tests/e2e/shop2-final-coherence-ui.spec.mjs tests/e2e/shop2-z-global.spec.mjs
      - name: Stop application and Redis REST proxy
        if: always()
        run: |
          if [ -f /tmp/dtsc-shop2-next.pid ]; then
            kill "$(cat /tmp/dtsc-shop2-next.pid)" || true
          fi
          if [ -f /tmp/dtsc-ci-redis-rest.pid ]; then
            kill "$(cat /tmp/dtsc-ci-redis-rest.pid)" || true
          fi
      - name: Upload Shop 2 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shop2-behavioral-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            /tmp/dtsc-shop2-build.log
            /tmp/dtsc-shop2-next.log
            /tmp/dtsc-ci-redis-rest.log
