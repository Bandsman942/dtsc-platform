name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ secrets.ERP_E2E_BASE_URL }}
      E2E_ORGANIZATION_ID: ${{ secrets.ERP_E2E_ORGANIZATION_ID }}
      E2E_ORGANIZATION_CODE: ${{ secrets.ERP_E2E_ORGANIZATION_CODE }}
      E2E_ADMIN_EMAIL: ${{ secrets.ERP_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ERP_E2E_ADMIN_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.ERP_E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.ERP_E2E_USER_PASSWORD }}
      E2E_CRON_SECRET: ${{ secrets.ERP_E2E_CRON_SECRET }}
      E2E_EXPIRED_INVITATION_TOKEN: ${{ secrets.ERP_E2E_EXPIRED_INVITATION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff checks
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --cached --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Type check
        run: pnpm type-check

      - name: Regression QA
        run: pnpm qa:regression

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright browser for authenticated ERP acceptance
        if: ${{ env.E2E_BASE_URL != '' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticated ERP browser acceptance
        if: ${{ env.E2E_BASE_URL != '' }}
        run: pnpm e2e:erp-professional

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_migration_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_migration_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_shadow_test?schema=public
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations from scratch
        run: pnpm prisma:deploy

      - name: Run final ERP audits on clean database
        run: |
          pnpm audit:erp-cutover -- --dry-run --json
          pnpm audit:financial-integrity -- --json

      - name: Prepare isolated shadow database
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS dtsc_shadow_test;
          CREATE DATABASE dtsc_shadow_test;
          SQL

      - name: Verify Finance migration schema parity
        run: node scripts/qa-enterprise-finance-migration-parity.mjs
