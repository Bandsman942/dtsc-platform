name: Quality gates

on:
  push:
    branches:
      - feat/sprint-04-work-prestations

permissions:
  contents: write

concurrency:
  group: sprint4-integrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-04-work-prestations
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Sprint 4 integration
        run: node scripts/sprint4-integrate.mjs

      - name: Restore permanent quality workflow and remove one-shot files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gates.yml
          git rm -f .github/workflows/sprint4-integrate.yml scripts/sprint4-integrate.mjs

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(work): integrate Sprint 4 workflow surfaces"
          git push origin HEAD:feat/sprint-04-work-prestations
