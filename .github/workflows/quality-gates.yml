name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/sprint-05-approved-work-payroll"

permissions:
  contents: write

concurrency:
  group: sprint5-typefix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-05-approved-work-payroll
          fetch-depth: 0

      - name: Apply targeted fixes
        run: python scripts/sprint5-fix-types.py

      - name: Restore permanent quality gates and clean patcher
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality-gates.yml
          git rm -f scripts/sprint5-fix-types.py

      - name: Validate and push
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(payroll): harden generic CRUD and transaction typing"
          git push origin HEAD:feat/sprint-05-approved-work-payroll
