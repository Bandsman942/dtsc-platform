name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Type check
        run: pnpm type-check

      - name: Regression QA
        run: pnpm qa:regression

      - name: Lint
        run: pnpm lint

  sprint3-docs-sync:
    if: github.event_name == 'push' && github.ref_name == 'feat/sprint-03-work-availability' && github.event.head_commit.message != 'docs: sync Sprint 3 documentation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-03-work-availability

      - name: Synchronize Sprint 3 documentation
        run: node scripts/sync-sprint3-docs.mjs

      - name: Commit documentation changes
        run: |
          if git diff --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/TECHNICAL_DOCUMENTATION.md docs/QA_REGRESSION_CHECKLIST.md docs/CHANGELOG.md
          git commit -m "docs: sync Sprint 3 documentation"
          git push origin HEAD:feat/sprint-03-work-availability
