name: Quality gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_quality_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_quality_test?schema=public
      AUTH_SECRET: quality-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      CRON_SECRET: quality-cron-secret-with-more-than-twenty-four-characters
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff checks
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --cached --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations for quality checks
        run: pnpm prisma:deploy

      - name: Type check
        run: pnpm type-check

      - name: Regression QA
        run: pnpm qa:regression

      - name: Standard modules iteration 01 QA
        run: node scripts/qa-standard-modules-iteration-01.mjs

      - name: Standard modules iteration 02 QA
        run: node scripts/qa-standard-modules-iteration-02.mjs

      - name: Standard modules iteration 03 QA
        run: node scripts/qa-standard-modules-iteration-03.mjs

      - name: Standard modules iteration 04 QA
        run: node scripts/qa-standard-work-coordination-checks.mjs all

      - name: Standard modules iteration 05 QA
        run: node scripts/qa-standard-modules-iteration-05.mjs

      - name: Standard modules iteration 06 QA
        run: node scripts/qa-standard-modules-iteration-06.mjs

      - name: Standard modules iteration 07 Console QA
        run: pnpm qa:standard-modules-iteration-07

      - name: Iteration 07 owner E2E remediation QA
        run: pnpm qa:iteration-07-owner-e2e-remediation

      - name: Iteration 07 owner E2E remediation v3 QA
        run: pnpm qa:iteration-07-owner-e2e-remediation-v3

      - name: User guide contract QA
        run: pnpm qa:user-guide-contract

      - name: Iteration 07 i18n contract QA
        run: pnpm qa:iteration-07-i18n-contract

      - name: Standard modules iteration 08 QA
        run: node scripts/qa-standard-modules-iteration-08.mjs

      - name: Standard collaboration E2E fixes QA
        run: node scripts/audit-standard-collaboration-e2e-fixes.mjs

      - name: Standard collaboration commercial readiness QA
        run: node scripts/audit-standard-collaboration-commercial-readiness.mjs

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_migration_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_migration_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_shadow_test?schema=public
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations from scratch
        run: pnpm prisma:deploy

      - name: Run standard modules iteration 08 on clean database
        run: node scripts/qa-standard-modules-iteration-08.mjs

      - name: Run final ERP audits on clean database
        run: |
          pnpm audit:erp-cutover -- --dry-run --json
          pnpm audit:financial-integrity -- --json

      - name: Run standard modules iteration 07 on clean database
        run: pnpm qa:standard-modules-iteration-07

      - name: Run iteration 07 owner remediation on clean database
        run: pnpm qa:iteration-07-owner-e2e-remediation

      - name: Run iteration 07 owner remediation v3 on clean database
        run: pnpm qa:iteration-07-owner-e2e-remediation-v3

      - name: Validate user guide contract
        run: pnpm qa:user-guide-contract

      - name: Validate iteration 07 i18n contract
        run: pnpm qa:iteration-07-i18n-contract

      - name: Prepare isolated shadow database
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS dtsc_shadow_test;
          CREATE DATABASE dtsc_shadow_test;
          SQL

      - name: Verify Finance migration schema parity
        run: node scripts/qa-enterprise-finance-migration-parity.mjs

  authenticated-browser-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: [quality, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_browser_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_browser_acceptance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_browser_acceptance?schema=public
      AUTH_SECRET: e2e-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      CRON_SECRET: e2e-cron-secret-with-more-than-twenty-four-characters
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ORGANIZATION_ID: e2e-erp-professional-org
      E2E_ORGANIZATION_CODE: e2e-erp-professional
      E2E_ADMIN_EMAIL: erp-admin@example.test
      E2E_ADMIN_PASSWORD: E2eAdmin2026!
      E2E_USER_EMAIL: erp-user@example.test
      E2E_USER_PASSWORD: E2eUser2026!
      E2E_CRON_SECRET: e2e-cron-secret-with-more-than-twenty-four-characters
      E2E_EXPIRED_INVITATION_TOKEN: e2e-expired-invitation-token
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:deploy

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Seed isolated authenticated ERP acceptance
        run: node scripts/seed-erp-professional-e2e.mjs

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start application for browser acceptance
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 >/tmp/dtsc-next.log 2>&1 &
          echo $! >/tmp/dtsc-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dtsc-next.log
          exit 1

      - name: Authenticated ERP browser acceptance
        run: pnpm e2e:erp-professional

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/dtsc-next.pid ]; then
            kill "$(cat /tmp/dtsc-next.pid)" || true
          fi

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erp-professional-browser-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            /tmp/dtsc-next.log
