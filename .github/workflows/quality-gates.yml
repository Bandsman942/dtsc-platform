name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Type check
        run: pnpm type-check

      - name: Regression QA
        run: pnpm qa:regression

      - name: Lint
        run: pnpm lint

  sprint3-branch-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sprint-03-work-availability'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-03-work-availability

      - name: Apply Sprint 3 review fixups
        run: node scripts/sprint3-fixups.mjs

      - name: Synchronize Sprint 3 documentation
        run: node scripts/sync-sprint3-docs.mjs

      - name: Commit synchronized changes
        run: |
          if git diff --quiet; then
            echo "Sprint 3 branch already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AGENTS.md \
            docs/TECHNICAL_DOCUMENTATION.md \
            docs/QA_REGRESSION_CHECKLIST.md \
            docs/CHANGELOG.md \
            app/api/calendar/availabilities/[id]/route.ts \
            app/api/calendar/exceptions/route.ts \
            app/calendar/page.tsx \
            components/calendar/dtsc-work-schedule-panel.tsx \
            components/calendar/internal-calendar-module.tsx \
            lib/work-schedule.ts
          git commit -m "fix(calendar): finalize Sprint 3 ownership and documentation"
          git push origin HEAD:feat/sprint-03-work-availability
