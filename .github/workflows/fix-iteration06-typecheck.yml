name: Fix iteration 06 native guides

on:
  push:
    branches:
      - chore/fix-iteration06-typecheck

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standard-modules-professionalization-iteration-06-enterprise-governance
          fetch-depth: 0

      - name: Teach the historical audit to resolve native guide identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/standard-module-professionalization-audit.mjs')
          content = path.read_text()
          old = '''function exists(file) {
            return fs.existsSync(path.join(root, file));
          }
          '''.replace('          ', '')
          new = r'''function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          function nativeGuideExists(uri) {
            const code = uri.slice("native://".length).trim();
            if (!/^[A-Z0-9_]+$/.test(code)) return false;
            const guidesRoot = path.join(root, "lib/user-guides");
            if (!fs.existsSync(guidesRoot)) return false;
            const escaped = escapeRegExp(code);
            const registryKey = new RegExp(String.raw`^\s*${escaped}\s*:\s*\{`, "m");
            const explicitCode = new RegExp(String.raw`code\s*:\s*["']${escaped}["']`);
            return fs.readdirSync(guidesRoot, { withFileTypes: true }).some((entry) => {
              if (!entry.isFile() || !entry.name.endsWith(".ts")) return false;
              const source = fs.readFileSync(path.join(guidesRoot, entry.name), "utf8");
              return registryKey.test(source) || explicitCode.test(source);
            });
          }

          function exists(file) {
            if (file.startsWith("native://")) return nativeGuideExists(file);
            return fs.existsSync(path.join(root, file));
          }
          '''.replace('          ', '')
          if old not in content:
            raise SystemExit('historical exists() helper not found')
          path.write_text(content.replace(old, new))
          PY

      - name: Validate native guide references
        run: |
          node scripts/qa-standard-modules-iteration-01.mjs
          node scripts/audit-standard-enterprise-governance-guides.mjs
          git diff --check

      - name: Commit and push feature fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/standard-module-professionalization-audit.mjs
          git diff --cached --check
          git commit -m "fix(guides): resolve native guide registry references"
          git push origin HEAD:feat/standard-modules-professionalization-iteration-06-enterprise-governance
