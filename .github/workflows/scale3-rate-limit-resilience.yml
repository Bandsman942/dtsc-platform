name: SCALE-3 rate-limit resilience evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_SCALE3_RESILIENCE to confirm the bounded Production resilience run
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: scale3-rate-limit-resilience
  cancel-in-progress: false

jobs:
  production-resilience:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 432 &&
       github.event.comment.author_association == 'OWNER' &&
       github.event.comment.body == 'RUN_SCALE3_RESILIENCE')
    name: Production multi-instance and controlled Redis failover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ vars.SCALE1_LOAD_BASE_URL }}
      SESSION_COOKIE: ${{ secrets.SCALE1_CTO_SESSION_COOKIE }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SCALE3_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACTS_DIR: artifacts
      SCALE3_HEALTHY_REQUESTS: "400"
      SCALE3_HEALTHY_CONCURRENCY: "80"
      SCALE3_HEALTHY_LIMIT: "50"
      SCALE3_FAILOVER_REQUESTS: "60"
      SCALE3_FAILOVER_CONCURRENCY: "30"
      SCALE3_LOCAL_LIMIT: "5"

    steps:
      - name: Validate manual resilience contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirmation }}" != "RUN_SCALE3_RESILIENCE" ]; then
              echo "::error::Confirmation must be RUN_SCALE3_RESILIENCE."
              exit 1
            fi
          else
            if [ "${{ github.event.issue.number }}" != "432" ] || \
               [ "${{ github.event.comment.author_association }}" != "OWNER" ] || \
               [ "${{ github.event.comment.body }}" != "RUN_SCALE3_RESILIENCE" ]; then
              echo "::error::Issue-comment resilience trigger is not authorized."
              exit 1
            fi
          fi

          if [ -z "${BASE_URL:-}" ] || [ -z "${SESSION_COOKIE:-}" ] || [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::SCALE1_LOAD_BASE_URL, SCALE1_CTO_SESSION_COOKIE and VERCEL_AUTOMATION_BYPASS_SECRET are required."
            exit 1
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::SCALE1_LOAD_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          echo "::add-mask::${SESSION_COOKIE}"
          echo "::add-mask::${VERCEL_AUTOMATION_BYPASS_SECRET}"

      - name: Publish owner-triggered run identity
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="SCALE-3C resilience run started — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`. Evidence is pending; no PASS is claimed until the artifact and gates are complete."
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/432/comments" \
            > /dev/null

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Run bounded Production resilience harness
        id: resilience
        shell: bash
        run: |
          set +e
          node scripts/load/scale3-rate-limit-resilience.mjs
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SCALE-3C evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale3-rate-limit-resilience-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/scale3-rate-limit-resilience-report.json
            artifacts/scale3-rate-limit-resilience-report.md

      - name: Enforce SCALE-3C gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.resilience.outputs.status }}"
          if [ -z "$status" ] || [ "$status" != "0" ]; then
            echo "::error::SCALE-3C Production resilience gates failed or the harness did not complete."
            exit 1
          fi
          if [ ! -f artifacts/scale3-rate-limit-resilience-report.json ]; then
            echo "::error::SCALE-3C sanitized report is missing."
            exit 1
          fi
          if [ "$(jq -r '.status' artifacts/scale3-rate-limit-resilience-report.json)" != "PASS" ]; then
            echo "::error::SCALE-3C sanitized report is not PASS."
            exit 1
          fi
          echo "SCALE-3C multi-instance and controlled failover evidence: PASS"

      - name: Publish owner-triggered sanitized result
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f artifacts/scale3-rate-limit-resilience-report.json ]; then
            report="artifacts/scale3-rate-limit-resilience-report.json"
            status="$(jq -r '.status' "$report")"
            healthy_requests="$(jq -r '.modes.healthy.requests' "$report")"
            healthy_allowed="$(jq -r '.modes.healthy.allowed' "$report")"
            healthy_instances="$(jq -r '.modes.healthy.instanceCount' "$report")"
            healthy_p95="$(jq -r '.modes.healthy.latencyMs.p95 // "n/a"' "$report")"
            healthy_primitive_p95="$(jq -r '.modes.healthy.primitiveLatencyMs.p95 // "n/a"' "$report")"
            closed_source="$(jq -r '.modes.closed.sources["fail-closed"] // 0' "$report")"
            local_source="$(jq -r '.modes.local.sources.local // 0' "$report")"
            open_source="$(jq -r '.modes.open.sources["fail-open"] // 0' "$report")"
            failover_p99="$(jq -r '[.modes.closed.primitiveLatencyMs.p99,.modes.local.primitiveLatencyMs.p99,.modes.open.primitiveLatencyMs.p99] | max // "n/a"' "$report")"
            failed_gates="$(jq -r 'if (.failedGates|length)==0 then "none" else (.failedGates|join(", ")) end' "$report")"
            body=$(cat <<EOF
          SCALE-3C resilience run completed — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`.

          Sanitized report: **${status}**. Healthy requests=${healthy_requests}; global allowed=${healthy_allowed}; observed instances=${healthy_instances}; HTTP P95=${healthy_p95} ms; primitive P95=${healthy_primitive_p95} ms; controlled failover sources closed/local/open=${closed_source}/${local_source}/${open_source}; max failover primitive P99=${failover_p99} ms; failed gates=${failed_gates}.

          Artifact is attached to GitHub Actions run \`${GITHUB_RUN_ID}\`. This comment contains no cookie, bypass secret, Redis URL/token, logical rate-limit key, IP, user/tenant identifier, hostname or raw provider error.
          EOF
          )
          else
            body="SCALE-3C resilience run ended without a generated sanitized report — run \`${GITHUB_RUN_ID}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`, main \`${GITHUB_SHA}\`. Inspect the run before drawing any resilience conclusion."
          fi
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/432/comments" \
            > /dev/null
