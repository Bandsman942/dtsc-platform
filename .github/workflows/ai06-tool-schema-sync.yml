name: AI06 temporary Tool Gateway schema sync

on:
  push:
    branches:
      - feat/185-ai06-tool-gateway
    paths:
      - scripts/ai/ai06-tool-schema-sync-trigger.txt

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/185-ai06-tool-gateway
          fetch-depth: 0
      - name: Synchronize Prisma schema
        run: node scripts/ai/sync-ai06-tool-schema.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit schema synchronization
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat(ai): synchronize Tool Gateway Prisma schema"
          git push origin HEAD:feat/185-ai06-tool-gateway
