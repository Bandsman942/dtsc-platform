name: Gaming Lounge #646 commercial readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/api/admin/client-organizations/route.ts"
      - "app/api/admin/sector-templates/route.ts"
      - "app/api/enterprise/**/gaming/**"
      - "app/enterprise-modules/GAMING_DASHBOARD/**"
      - "components/enterprise/gaming/**"
      - "docs/user-guides/GAMING_LOUNGE_*.md"
      - "lib/enterprise/business-subtype-registry.ts"
      - "lib/enterprise/sector-onboarding-readiness.json"
      - "lib/enterprise/sector-template-application.ts"
      - "lib/enterprise/gaming/**"
      - "lib/enterprise/module-registry-gaming.json"
      - "scripts/qa-646-gaming-commercial-readiness.mjs"
      - "scripts/qa-regression-checks.mjs"
      - "tests/e2e/issue-646-gaming-commercial-readiness.spec.mjs"
      - ".github/workflows/gaming-646-commercial-readiness.yml"

permissions:
  contents: read

concurrency:
  group: gaming-646-commercial-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Gaming onboarding and commercial readiness acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dtsc_gaming_646_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dtsc_gaming_646_acceptance"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dtsc_gaming_646_acceptance?schema=public
      AUTH_SECRET: gaming-646-acceptance-auth-secret-with-more-than-thirty-two-characters-2026
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_PUBLIC_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CONSOLE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ACCOUNT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPPORT_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_ORGANIZATION_ID: e2e-erp-professional-org
      E2E_ORGANIZATION_CODE: e2e-erp-professional
      E2E_ADMIN_EMAIL: erp-admin@example.test
      E2E_ADMIN_PASSWORD: E2eAdmin2026!
      E2E_USER_EMAIL: erp-user@example.test
      E2E_USER_PASSWORD: E2eUser2026!
      DEFAULT_ADMIN_BOOTSTRAP_ENABLED: "false"
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: dtsc-gaming-646-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REDIS_REST_TOKEN: dtsc-gaming-646-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start isolated Redis REST proxy
        run: |
          nohup node scripts/ci-upstash-redis-rest-proxy.mjs >/tmp/dtsc-gaming-646-redis-rest.log 2>&1 &
          echo $! >/tmp/dtsc-gaming-646-redis-rest.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${CI_REDIS_REST_TOKEN}" http://127.0.0.1:8079/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dtsc-gaming-646-redis-rest.log
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations from scratch
        run: pnpm prisma:deploy
      - name: Seed canonical ERP acceptance tenant
        run: node scripts/seed-erp-professional-e2e.mjs
      - name: Validate issue 646 static contract
        run: node scripts/qa-646-gaming-commercial-readiness.mjs
      - name: Run regression QA
        run: pnpm qa:regression
      - name: Type-check
        run: pnpm type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Build production application
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/dtsc-gaming-646-build.log
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start production application
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 >/tmp/dtsc-gaming-646-next.log 2>&1 &
          echo $! >/tmp/dtsc-gaming-646-next.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/auth/sign-in >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dtsc-gaming-646-next.log
          exit 1
      - name: Gaming #646 browser readiness acceptance
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/issue-646-gaming-commercial-readiness.spec.mjs --workers=1 2>&1 | tee /tmp/dtsc-gaming-646-browser-playwright.log
      - name: Gaming #645 end-to-end regression
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/issue-645-gaming-owner.spec.mjs --workers=1 2>&1 | tee /tmp/dtsc-gaming-646-existing-browser.log
      - name: Gaming DTSC AI Tool Gateway regression
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/tests/e2e/stubs
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/issue-645-gaming-ai.spec.ts --workers=1 2>&1 | tee /tmp/dtsc-gaming-646-ai-playwright.log
      - name: Stop application and Redis REST proxy
        if: always()
        run: |
          if [ -f /tmp/dtsc-gaming-646-next.pid ]; then kill "$(cat /tmp/dtsc-gaming-646-next.pid)" || true; fi
          if [ -f /tmp/dtsc-gaming-646-redis-rest.pid ]; then kill "$(cat /tmp/dtsc-gaming-646-redis-rest.pid)" || true; fi
      - name: Upload Gaming #646 diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gaming-646-commercial-readiness-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            /tmp/dtsc-gaming-646-build.log
            /tmp/dtsc-gaming-646-next.log
            /tmp/dtsc-gaming-646-browser-playwright.log
            /tmp/dtsc-gaming-646-existing-browser.log
            /tmp/dtsc-gaming-646-ai-playwright.log
            /tmp/dtsc-gaming-646-redis-rest.log
