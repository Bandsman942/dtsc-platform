name: Apply iteration 2 type fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/iteration2-typefix/**"
      - ".github/workflows/apply-iteration2-typefix.yml"

permissions:
  contents: write

concurrency:
  group: apply-iteration2-typefix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/erp-professionalization-iteration-02-crm-master-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/erp-professionalization-iteration-02-crm-master-data
          fetch-depth: 0

      - name: Verify patch
        run: |
          echo "afe635bbcc2508b5e2a2789fe4db0f9e40e7fe331286d4a6f8b85a79c5e1bfcd  .github/iteration2-typefix/typefix.patch" | sha256sum -c -
          git apply --check .github/iteration2-typefix/typefix.patch

      - name: Apply and publish type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index .github/iteration2-typefix/typefix.patch
          git rm -r .github/iteration2-typefix .github/workflows/apply-iteration2-typefix.yml
          git commit -m "fix: align professional ERP types with Prisma contracts"
          git push origin HEAD:feat/erp-professionalization-iteration-02-crm-master-data
