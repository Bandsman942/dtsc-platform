name: Apply final calendar lint fix

on:
  push:
    branches:
      - fix/iteration-04-owner-e2e-remediation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iteration-04-owner-e2e-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source fix
        run: node scripts/apply-final-calendar-lint-fix.mjs
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/calendar/internal-calendar-workspace-v2.tsx
          git commit -m "fix(lint): escape final calendar apostrophe"
          git push origin HEAD:fix/iteration-04-owner-e2e-remediation
