name: Temporary issue 307 codemod

on:
  push:
    branches:
      - fix/307-mobile-money-multicurrency-accounts

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(307): run guarded repository codemod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/307-mobile-money-multicurrency-accounts
          fetch-depth: 0
      - name: Apply guarded codemod
        run: node scripts/tmp-307-codemod.mjs
      - name: Remove temporary runner files
        run: rm scripts/tmp-307-codemod.mjs .github/workflows/tmp-307-codemod.yml
      - name: Commit guarded changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(retail): apply issue 307 canonical account routing"
          git push origin HEAD:fix/307-mobile-money-multicurrency-accounts
