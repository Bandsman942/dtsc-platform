name: Temporary #307 multi-till polish

on:
  push:
    branches:
      - fix/307-mobile-money-multicurrency-accounts

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/307-mobile-money-multicurrency-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish concurrent till UX
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sharedPath = 'components/enterprise/professional/retail-workspace-shared.tsx';
          let shared = fs.readFileSync(sharedPath, 'utf8');
          const oldBar = '{context.dashboard ? <CashSessionBar session={context.dashboard.cashSession} locale={locale} /> : null}';
          const newBar = '{context.dashboard && moduleCode !== "MOBILE_MONEY_AGENCY" ? <CashSessionBar session={context.dashboard.cashSession} locale={locale} /> : null}';
          if (!shared.includes(oldBar)) throw new Error('Retail CashSessionBar marker not found');
          shared = shared.replace(oldBar, newBar);
          fs.writeFileSync(sharedPath, shared);

          const managerPath = 'components/enterprise/professional/mobile-money-cash-session-manager.tsx';
          let manager = fs.readFileSync(managerPath, 'utf8');
          const oldIcons = 'import { Banknote, CheckCircle2, CircleDollarSign, LockKeyhole, Plus, WalletCards } from "lucide-react";';
          const newIcons = 'import { Banknote, CheckCircle2, CircleDollarSign, LockKeyhole, Plus } from "lucide-react";';
          if (!manager.includes(oldIcons)) throw new Error('Mobile Money manager icon marker not found');
          manager = manager.replace(oldIcons, newIcons);
          manager = manager.replace('import { customerFacingStatusLabel } from "@/lib/customer-facing-language";\n', '');
          fs.writeFileSync(managerPath, manager);
          NODE
          rm .github/workflows/tmp-307-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/enterprise/professional/retail-workspace-shared.tsx components/enterprise/professional/mobile-money-cash-session-manager.tsx .github/workflows/tmp-307-codemod.yml
          git commit -m "fix(retail): polish concurrent Mobile Money till UX"
          git push origin HEAD:fix/307-mobile-money-multicurrency-accounts
