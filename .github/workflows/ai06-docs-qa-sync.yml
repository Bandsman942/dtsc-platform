name: AI06 temporary docs and QA sync

on:
  push:
    branches:
      - feat/185-ai06-tool-gateway
    paths:
      - scripts/ai/ai06-docs-qa-sync-trigger.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/185-ai06-tool-gateway
          fetch-depth: 0
      - name: Synchronize docs and QA commands
        run: node scripts/ai/sync-ai06-docs-and-qa.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit synchronized files
        run: |
          if git diff --quiet -- package.json lib/user-guides/iteration05-guides.ts docs/STANDARD_AI_ORCHESTRATION_ARCHITECTURE.md docs/TECHNICAL_DOCUMENTATION.md docs/CHANGELOG.md; then
            echo "No sync change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json lib/user-guides/iteration05-guides.ts docs/STANDARD_AI_ORCHESTRATION_ARCHITECTURE.md docs/TECHNICAL_DOCUMENTATION.md docs/CHANGELOG.md
          git commit -m "docs(ai): synchronize AI06 governance and user guidance"
          git push origin HEAD:feat/185-ai06-tool-gateway
