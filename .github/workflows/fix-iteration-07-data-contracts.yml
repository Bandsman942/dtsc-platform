name: Fix iteration 07 data contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-iteration-07-data-contracts.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/iteration-07-e2e-remediation-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply targeted data contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/admin/console-page.tsx')
          text = path.read_text()
          before = 'include: { user: { select: { name: true, email: true } }, hrcfoTransaction: { select: { reference: true } } },'
          after = 'include: { user: { select: { name: true, email: true } }, hrcfoTransaction: { select: { id: true, title: true } } },'
          if before not in text:
              raise SystemExit('console invoice include target not found')
          text = text.replace(before, after)
          before = 'transactionReference: invoice.hrcfoTransaction?.reference || null,'
          after = 'transactionReference: invoice.hrcfoTransaction?.title || invoice.hrcfoTransaction?.id || null,'
          if before not in text:
              raise SystemExit('console transaction reference target not found')
          path.write_text(text.replace(before, after))

          path = Path('app/api/billing/organization-checkout/route.ts')
          text = path.read_text()
          before = 'if ([PaymentStatus.ACCEPTED, PaymentStatus.PAID].includes(pending.status)) {'
          after = 'if (pending.status === PaymentStatus.ACCEPTED || pending.status === PaymentStatus.PAID) {'
          if before not in text:
              raise SystemExit('checkout status target not found')
          path.write_text(text.replace(before, after))

          path = Path('lib/subscription-payments.ts')
          text = path.read_text()
          before = '''  });
  let invoice = await prisma.invoice.findUnique({ where: { manualPaymentId: request.id } });
  if (!invoice) invoice = await prisma.invoice.create({ data: { number: buildInvoiceNumber(), userId: request.userId, planId: request.planId, subscriptionId, paymentId, manualPaymentId: request.id, category: "PERSONAL_SUBSCRIPTION", recipientEmail: request.user.email, planName: request.plan.name, amount: request.amount, currency: request.currency, status: InvoiceStatus.PAID, paidAt: new Date() } });'''
          after = '''  });
  if (!subscriptionId || !paymentId) throw new Error("MANUAL_PAYMENT_APPROVAL_INCOMPLETE");
  let invoice = await prisma.invoice.findUnique({ where: { manualPaymentId: request.id } });
  if (!invoice) invoice = await prisma.invoice.create({ data: { number: buildInvoiceNumber(), userId: request.userId, planId: request.planId, subscriptionId, paymentId, manualPaymentId: request.id, category: "PERSONAL_SUBSCRIPTION", recipientEmail: request.user.email, planName: request.plan.name, amount: request.amount, currency: request.currency, status: InvoiceStatus.PAID, paidAt: new Date() } });'''
          if before not in text:
              raise SystemExit('personal manual payment invoice target not found')
          path.write_text(text.replace(before, after))
          PY
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/console-page.tsx app/api/billing/organization-checkout/route.ts lib/subscription-payments.ts
          git commit -m 'fix: align iteration 07 Prisma data contracts'
          git push origin HEAD:${{ github.head_ref }}
