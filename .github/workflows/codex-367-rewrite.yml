name: Codex Retail operator i18n rewrite 367

on:
  push:
    branches:
      - refactor/367-retail-operator-i18n

permissions:
  contents: write

concurrency:
  group: codex-367-retail-operator-i18n
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: refactor/367-retail-operator-i18n
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch rewrite scope detector
        run: node scripts/codex-367-hotfix-scope.mjs
      - name: Apply canonical Retail rewrite
        run: node scripts/codex-367-rewrite.mjs
      - name: Validate targeted contract
        run: node scripts/qa-retail-operator-i18n-367.mjs
      - name: Type check generated rewrite
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm type-check
      - name: Commit generated implementation and remove rewrite scaffolding
        run: |
          git rm -f .github/workflows/codex-367-rewrite.yml scripts/codex-367-rewrite.mjs scripts/codex-367-hotfix-scope.mjs
          git add components/enterprise/professional locales scripts/run-regression-qa-ci.mjs scripts/qa-retail-operator-i18n-367.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(i18n): canonicalize Retail operator surfaces"
          git push origin HEAD:refactor/367-retail-operator-i18n
