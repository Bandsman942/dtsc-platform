name: Export iteration 05 source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/export-iteration-05-source.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude='*.tar.gz' \
            -czf dtsc-platform-iteration-05-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: dtsc-platform-iteration-05-source
          path: dtsc-platform-iteration-05-source.tar.gz
          if-no-files-found: error
          retention-days: 1
