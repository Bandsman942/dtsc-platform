name: Temporary #307 lint polish

on:
  push:
    branches:
      - fix/307-mobile-money-multicurrency-accounts

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/307-mobile-money-multicurrency-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove unstable hook dependency warning
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'components/enterprise/professional/mobile-money-agency-workspace.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const before = `  const eligibleProviders = useMemo(\n    () => providers.filter((provider) => provider.accounts.some((mapping) => mapping.currencyCode === currency)),\n    [currency, providers],\n  );`;
          const after = `  const eligibleProviders = providers.filter((provider) => provider.accounts.some((mapping) => mapping.currencyCode === currency));`;
          if (!source.includes(before)) throw new Error('eligibleProviders marker not found');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
          rm .github/workflows/tmp-307-lint-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/enterprise/professional/mobile-money-agency-workspace.tsx .github/workflows/tmp-307-lint-polish.yml
          git commit -m "fix(retail): keep Mobile Money selector lint-clean"
          git push origin HEAD:fix/307-mobile-money-multicurrency-accounts
