name: Apply iteration 7 E2E follow-up

on:
  push:
    branches:
      - fix/e2e-iteration-07-activities-billing-collaboration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          for part in .transfer/iteration7-followup.patch.gz.b64.{00..11}; do
            test -f "$part"
          done
          cat .transfer/iteration7-followup.patch.gz.b64.{00..11} > /tmp/followup.patch.gz.b64
          test "$(wc -c < /tmp/followup.patch.gz.b64)" = "60044"
          echo "5e06117cb576f3f2d8973e6b43aba9f39938c7246c0fd94e99cb5f22bc55d2ca  /tmp/followup.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/followup.patch.gz.b64 | gzip -d > /tmp/followup.patch
          echo "03a4cecbe711492100caae425e2c5416de9008a1a68d14adbbb6950318ad69c6  /tmp/followup.patch" | sha256sum -c -
          git apply --binary /tmp/followup.patch
          rm -f .transfer/iteration7-followup.patch.gz.b64.{00..11}
          rm -f .github/workflows/apply-iteration7-followup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address iteration 7 owner E2E findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
